<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nami Mobile Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="mobile.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 font-sans">
    <div id="mobile-content" style="display:none;">
        <div class="p-4 max-w-md mx-auto">
            <h1 class="font-orbitron text-2xl font-black text-slate-900 mb-6 tracking-tighter uppercase">Nami Portfolio</h1>
            
            <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="render('india')" class="px-6 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold shadow-lg transition-all active:scale-95">India</button>
                <button onclick="render('singapore')" class="px-6 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-bold shadow-md transition-all active:scale-95">Singapore</button>
                <button onclick="render('health')" class="px-6 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow-md transition-all active:scale-95">Health</button>
            </div>

            <div id="summary-bar" class="mb-8 shadow-2xl bg-slate-900 rounded-[30px] p-6 text-white flex flex-col gap-4">
                <div>
                    <p class="text-[9px] text-slate-500 uppercase font-black tracking-[0.2em] mb-1">Total Sum Assured</p>
                    <p id="total-sa" class="text-emerald-400 font-orbitron font-black text-xl">₹0</p>
                </div>
                <div>
                    <p class="text-[9px] text-slate-500 uppercase font-black tracking-[0.2em] mb-1">Annual Premium</p>
                    <p id="total-premium" class="text-indigo-400 font-orbitron font-black text-xl">₹0</p>
                </div>
                <div>
                    <p class="text-[9px] text-slate-500 uppercase font-black tracking-[0.2em] mb-1">Portfolio Value</p>
                    <p id="total-unit-value" class="text-pink-500 font-orbitron font-black text-xl">₹0</p>
                </div>
            </div>

            <div id="container" class="space-y-4 pb-10"></div>
        </div>
    </div>

    <script type="module">
        import { POLICY_DATA } from './data.js';
        
        const PIN = "1977"; 

        const toNum = (val) => {
            if (!val) return 0;
            if (typeof val === 'number') return val;
            return parseFloat(val.toString().replace(/[^0-9.-]+/g, "")) || 0;
        };

        const getIcon = (tag) => {
            const icons = { 'man': '👨‍💼', 'woman': '👩‍💼', 'child_care': '👧' };
            return icons[tag] || '📄';
        };

        window.render = function(cat) {
            const container = document.getElementById('container');
            const sym = (cat === 'singapore') ? "$" : "₹";
            const list = POLICY_DATA[cat] || [];

            // 1. Logic for Totals
            const tSA = list.reduce((acc, p) => acc + (toNum(p.sumAssured || p.coverage || p.sum_assured)), 0);
            const tAnn = list.reduce((acc, p) => acc + (p.status !== "PAID UP" ? toNum(p.premium || p.annualPremium || p.amt) : 0), 0);
            const tVal = list.reduce((acc, p) => acc + toNum(p.currentUnitValue || 0), 0);

            document.getElementById('total-sa').innerText = sym + Math.round(tSA).toLocaleString();
            document.getElementById('total-premium').innerText = sym + Math.round(tAnn).toLocaleString();
            document.getElementById('total-unit-value').innerText = sym + Math.round(tVal).toLocaleString();

            // 2. Render Cards with Multi-Field Mapping
            container.innerHTML = list.map(p => {
                const name = p.name || p.policyName || "Policy";
                const sa = p.sumAssured || p.coverage || p.sum_assured || "0";
                const prem = p.premium || p.annualPremium || p.amt || "0";
                const due = p.dueDate || p.nextPremiumDue || p.nextDue || (p.status === 'PAID UP' ? 'COMPLETED' : 'N/A');
                const mat = p.premiumEnds || p.maturityDate || p.expiryDate || p.maturity || 'N/A';

                return `
                <div class="bg-white rounded-[24px] p-6 border border-slate-100 shadow-sm relative overflow-hidden mb-4">
                    ${p.status === "PAID UP" ? '<div class="absolute top-0 right-0 bg-emerald-500 text-white text-[8px] font-black px-3 py-1 rounded-bl-lg uppercase">PAID UP</div>' : ''}
                    
                    <div class="flex items-start gap-3 mb-4">
                        <span class="text-xl mt-1">${getIcon(p.assignedTo)}</span>
                        <div>
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">${p.type || p.category || 'PLAN'}</p>
                            <h3 class="font-black text-slate-900 text-lg leading-tight">${name}</h3>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-y-5 gap-x-4 border-t border-slate-50 pt-5">
                        <div>
                            <p class="text-[8px] font-black text-slate-400 uppercase tracking-tighter mb-1">${cat === 'health' ? 'Coverage' : 'Sum Assured'}</p>
                            <p class="font-bold text-slate-900 text-sm">${sym}${toNum(sa).toLocaleString()}</p>
                        </div>
                        <div>
                            <p class="text-[8px] font-black text-slate-400 uppercase tracking-tighter mb-1">Premium</p>
                            <p class="font-bold text-indigo-600 text-sm">${sym}${toNum(prem).toLocaleString()}</p>
                        </div>
                        <div>
                            <p class="text-[8px] font-black text-slate-400 uppercase tracking-tighter mb-1">${cat === 'health' ? 'Expiry' : 'Maturity'}</p>
                            <p class="font-bold text-slate-600 text-[11px]">${mat}</p>
                        </div>
                        <div>
                            <p class="text-[8px] font-black text-slate-400 uppercase tracking-tighter mb-1">Next Due</p>
                            <p class="font-bold ${due === 'COMPLETED' ? 'text-emerald-500' : 'text-slate-600'} text-[11px]">${due}</p>
                        </div>

                        ${p.currentUnitValue ? `
                        <div class="col-span-2 bg-pink-50 p-3 rounded-xl border border-pink-100 mt-1">
                             <p class="text-[8px] font-black text-pink-400 uppercase tracking-tighter mb-1">Portfolio Value</p>
                             <p class="font-black text-pink-600 text-md">${sym}${toNum(p.currentUnitValue).toLocaleString()}</p>
                        </div>` : ''}
                    </div>
                </div>`;
            }).join('');
        };

        const authCheck = () => {
            const contentDiv = document.getElementById('mobile-content');
            if (sessionStorage.getItem('nami_auth') === 'true') {
                contentDiv.style.display = 'block';
                return true;
            }
            const entry = prompt("Enter PIN:");
            if (entry === PIN) {
                sessionStorage.setItem('nami_auth', 'true');
                contentDiv.style.display = 'block';
                return true;
            } else {
                window.location.href = "https://google.com";
                return false;
            }
        };

        // THE FIX: Wait for DOM before running scripts
        document.addEventListener('DOMContentLoaded', () => {
            if (authCheck()) {
                render('india');
            }
        });
    </script>
</body>
</html>
