<script type="module">
    import { POLICY_DATA } from './data.js';
    
    const PIN = "1977"; 

    const toNum = (val) => {
        if (!val) return 0;
        if (typeof val === 'number') return val;
        // Handle cases where premium might be an object or string
        return parseFloat(val.toString().replace(/[^0-9.-]+/g, "")) || 0;
    };

    window.render = function(cat) {
        const container = document.getElementById('container');
        const list = POLICY_DATA[cat] || [];
        
        // 1. DYNAMIC CALCULATIONS
        let tSA = 0, tAnn = 0, tVal = 0;
        let sym = (cat === 'singapore') ? "$" : "₹";

        list.forEach(p => {
            tSA += toNum(p.sumAssured || p.coverage || 0);
            tVal += toNum(p.currentUnitValue || 0);
            
            // Health specific premium logic (Cash + CPF)
            if (cat === 'health') {
                tAnn += (toNum(p.cashAmount) + (p.cpfAmount ? toNum(p.cpfAmount) : 0));
            } else {
                tAnn += (p.status !== "PAID UP" ? toNum(p.premium || p.annualPremium || p.amt) : 0);
            }
        });

        document.getElementById('total-sa').innerText = sym + Math.round(tSA).toLocaleString();
        document.getElementById('total-premium').innerText = sym + Math.round(tAnn).toLocaleString();
        document.getElementById('total-unit-value').innerText = sym + Math.round(tVal).toLocaleString();

        // 2. RENDER CARDS
        container.innerHTML = list.map(p => {
            const name = p.name || p.policyName || "Policy";
            const sa = p.sumAssured || p.coverage || "0";
            
            // Logic to determine Premium display
            let premiumDisplay = "";
            if (cat === 'health') {
                const totalHealthPrem = toNum(p.cashAmount) + (p.cpfAmount ? toNum(p.cpfAmount) : 0);
                premiumDisplay = `${sym}${totalHealthPrem.toLocaleString()}`;
            } else {
                premiumDisplay = `${sym}${toNum(p.premium || p.annualPremium || p.amt).toLocaleString()}`;
            }

            // Date mapping
            const due = p.expiryDate || p.dueDate || p.nextPremiumDue || (p.status === 'PAID UP' ? 'COMPLETED' : 'N/A');
            const mat = p.maturityDate || p.premiumEnds || p.expiryDate || 'N/A';
            
            // Owner/Assigned mapping (Family icons)
            const owner = p.owner || p.assignedTo || "";
            const icon = owner.toLowerCase().includes('man') || owner.toLowerCase().includes('father') ? '👨‍💼' : 
                         owner.toLowerCase().includes('woman') || owner.toLowerCase().includes('mother') ? '👩‍💼' : 
                         owner.toLowerCase().includes('daughter') ? '👧' : '🏥';

            return `
            <div class="bg-white rounded-[24px] p-6 border border-slate-100 shadow-sm relative overflow-hidden mb-4">
                <div class="flex items-start gap-3 mb-4">
                    <span class="text-xl mt-1">${icon}</span>
                    <div>
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">${p.category || p.type || 'HEALTH'}</p>
                        <h3 class="font-black text-slate-900 text-lg leading-tight">${name}</h3>
                        <p class="text-[10px] text-slate-500 font-bold">${p.company || ''}</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-y-5 gap-x-4 border-t border-slate-50 pt-5">
                    <div>
                        <p class="text-[8px] font-black text-slate-400 uppercase tracking-tighter mb-1">Coverage</p>
                        <p class="font-bold text-slate-900 text-sm">${sym}${toNum(sa).toLocaleString()}</p>
                    </div>
                    <div>
                        <p class="text-[8px] font-black text-slate-400 uppercase tracking-tighter mb-1">Premium</p>
                        <p class="font-bold text-indigo-600 text-sm">${premiumDisplay}</p>
                    </div>
                    <div>
                        <p class="text-[8px] font-black text-slate-400 uppercase tracking-tighter mb-1">Expiry Date</p>
                        <p class="font-bold text-slate-600 text-[11px]">${due}</p>
                    </div>
                    <div>
                        <p class="text-[8px] font-black text-slate-400 uppercase tracking-tighter mb-1">Company</p>
                        <p class="font-bold text-slate-600 text-[11px] truncate">${p.company || 'N/A'}</p>
                    </div>
                </div>
            </div>`;
        }).join('');
    };

    // Auth and Init
    document.addEventListener('DOMContentLoaded', () => {
        const contentDiv = document.getElementById('mobile-content');
        if (sessionStorage.getItem('nami_auth') === 'true') {
            contentDiv.style.display = 'block';
            render('india');
        } else {
            const entry = prompt("Enter PIN:");
            if (entry === PIN) {
                sessionStorage.setItem('nami_auth', 'true');
                contentDiv.style.display = 'block';
                render('india');
            } else {
                window.location.href = "https://google.com";
            }
        }
    });
</script>
