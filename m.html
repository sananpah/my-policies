<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nami Mobile Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="mobile.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        body { -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
    </style>
</head>
<body class="font-sans">
    <div id="mobile-content" style="display:none;">
        <div class="p-4 max-w-md mx-auto">
            <h1 class="font-orbitron text-2xl font-black text-slate-900 mb-6 tracking-tighter uppercase">Nami Portfolio</h1>
            
            <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="render('india')" class="px-6 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold shadow-lg transition-all active:scale-95">India</button>
                <button onclick="render('singapore')" class="px-6 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-bold shadow-md transition-all active:scale-95">Singapore</button>
                <button onclick="render('health')" class="px-6 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow-md transition-all active:scale-95">Health</button>
            </div>

            <div id="summary-bar" class="mb-8 shadow-2xl bg-slate-900 rounded-[30px] p-6 text-white flex flex-col gap-4">
                <div>
                    <p class="text-[9px] text-slate-500 uppercase font-black tracking-[0.2em] mb-1">Total Sum Assured</p>
                    <p id="total-sa" class="text-emerald-400 font-orbitron font-black text-xl">₹0</p>
                </div>
                <div>
                    <p class="text-[9px] text-slate-500 uppercase font-black tracking-[0.2em] mb-1">Annual Premium</p>
                    <p id="total-premium" class="text-indigo-400 font-orbitron font-black text-xl">₹0</p>
                </div>
                <div>
                    <p class="text-[9px] text-slate-500 uppercase font-black tracking-[0.2em] mb-1">Portfolio Value</p>
                    <p id="total-unit-value" class="text-pink-500 font-orbitron font-black text-xl">₹0</p>
                </div>
            </div>

            <div id="container" class="space-y-4 pb-10"></div>
        </div>
    </div>

    <script type="module">
        import { POLICY_DATA } from './data.js';
        // IMPORT HEALTH DATA FROM THE SECOND FILE
        import { healthData } from './data_health.js';
        
        const PIN = "1977"; 

        const toNum = (val) => {
            if (!val) return 0;
            if (typeof val === 'number') return val;
            return parseFloat(val.toString().replace(/[^0-9.-]+/g, "")) || 0;
        };

        window.render = function(cat) {
            const container = document.getElementById('container');
            
            // LOGIC TO SELECT DATA SOURCE
            let list = [];
            if (cat === 'health') {
                list = healthData; // Use the healthData array directly
            } else {
                list = POLICY_DATA[cat] || [];
            }

            let sym = (cat === 'singapore' || (cat === 'health' && list.length > 0 && list[0].currency === 'SGD')) ? "$" : "₹";

            let tSA = 0, tAnn = 0, tVal = 0;

            list.forEach(p => {
                tSA += toNum(p.sumAssured || p.coverage || 0);
                tVal += toNum(p.currentUnitValue || 0);
                
                if (cat === 'health') {
                    // Combine Cash + CPF for Health
                    tAnn += (toNum(p.cashAmount) + (p.cpfAmount ? toNum(p.cpfAmount) : 0));
                } else {
                    tAnn += (p.status !== "PAID UP" ? toNum(p.premium || p.annualPremium) : 0);
                }
            });

            document.getElementById('total-sa').innerText = sym + Math.round(tSA).toLocaleString();
            document.getElementById('total-premium').innerText = sym + Math.round(tAnn).toLocaleString();
            document.getElementById('total-unit-value').innerText = sym + Math.round(tVal).toLocaleString();

            const getIcon = (item) => {
                const id = (item.owner || item.assignedTo || "").toLowerCase();
                if (id.includes('father') || id.includes('man')) return '👨‍💼';
                if (id.includes('mother') || id.includes('woman')) return '👩‍💼';
                if (id.includes('daughter')) return '👧';
                return '🏥';
            };

            container.innerHTML = list.map(p => {
                const name = p.name || p.policyName || "Policy";
                const prem = (cat === 'health') ? 
                    (toNum(p.cashAmount) + (p.cpfAmount ? toNum(p.cpfAmount) : 0)) : 
                    toNum(p.premium || p.annualPremium);

                const due = p.expiryDate || p.dueDate || p.nextPremiumDue || (p.status === 'PAID UP' ? 'COMPLETED' : 'N/A');

                return `
                <div class="bg-white rounded-[24px] p-6 border border-slate-100 shadow-sm relative mb-4">
                    <div class="flex items-start gap-3 mb-4">
                        <span class="text-xl mt-1">${getIcon(p)}</span>
                        <div>
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">${p.category || p.type || 'PLAN'}</p>
                            <h3 class="font-black text-slate-900 text-lg leading-tight">${name}</h3>
                            <p class="text-[10px] text-slate-500 font-bold">${p.company || ''}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-y-5 border-t border-slate-50 pt-5">
                        <div>
                            <p class="text-[8px] font-black text-slate-400 uppercase tracking-tighter mb-1">Coverage</p>
                            <p class="font-bold text-slate-900 text-sm">${sym}${toNum(p.sumAssured || p.coverage).toLocaleString()}</p>
                        </div>
                        <div>
                            <p class="text-[8px] font-black text-slate-400 uppercase tracking-tighter mb-1">Premium</p>
                            <p class="font-bold text-indigo-600 text-sm">${sym}${prem.toLocaleString()}</p>
                        </div>
                        <div>
                            <p class="text-[8px] font-black text-slate-400 uppercase tracking-tighter mb-1">Expiry/Due</p>
                            <p class="font-bold text-slate-600 text-[11px]">${due}</p>
                        </div>
                        <div>
                            <p class="text-[8px] font-black text-slate-400 uppercase tracking-tighter mb-1">Status</p>
                            <p class="font-bold text-slate-600 text-[11px] uppercase">${p.status || 'Active'}</p>
                        </div>
                    </div>
                </div>`;
            }).join('');
        };

        document.addEventListener('DOMContentLoaded', () => {
            const contentDiv = document.getElementById('mobile-content');
            if (sessionStorage.getItem('nami_auth') === 'true') {
                contentDiv.style.display = 'block';
                render('india');
            } else {
                const entry = prompt("Enter PIN:");
                if (entry === PIN) {
                    sessionStorage.setItem('nami_auth', 'true');
                    contentDiv.style.display = 'block';
                    render('india');
                } else {
                    window.location.href = "https://google.com";
                }
            }
        });
    </script>
</body>
</html>
