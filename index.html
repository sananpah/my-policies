<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Portfolio Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        
        /* Tooltip Logic */
        .segment-container { position: relative; cursor: pointer; }
        .tooltip-text { 
            visibility: hidden; opacity: 0; position: absolute; 
            bottom: 40px; left: 50%; transform: translateX(-50%); 
            background: #1e293b; color: white; padding: 10px 14px; 
            border-radius: 8px; font-size: 11px; font-weight: 700; 
            white-space: pre-wrap; width: max-content; max-width: 280px; 
            text-align: center; line-height: 1.6; transition: all 0.2s ease-in-out; 
            z-index: 100; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        .segment-container:hover > .tooltip-text { visibility: visible; opacity: 1; transform: translate(-50%, -5px); }
        
        /* Specific Maturity Tooltip Positioning */
        .maturity-wrapper:hover > .tooltip-maturity { visibility: visible; opacity: 1; transform: translate(-20%, -5px); }
        .tooltip-maturity { left: auto; right: 0; transform: none; }

        .policy-card { background: white; border-left: 8px solid; border-radius: 16px; margin-bottom: 1.5rem; transition: all 0.3s; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .content-area { display: none; }
        .open .content-area { display: block; }
        
        .payout-dot { width: 12px; height: 12px; background: #3b82f6; border-radius: 50%; position: absolute; top: 50%; transform: translate(-50%, -50%); border: 2px solid white; z-index: 50; }
        .maturity-dot { background: #ef4444 !important; width: 18px !important; height: 18px !important; }
        
        .tab-btn { padding: 10px 24px; font-weight: 700; text-transform: uppercase; font-size: 11px; border-radius: 8px; transition: all 0.3s; border: 1px solid #e2e8f0; background: white; color: #64748b; cursor: pointer; }
        .tab-btn.active { background: #8b1d1d; color: white; border-color: #8b1d1d; }
        
        .paid-watermark { position: absolute; right: 200px; top: 25px; font-weight: 900; font-size: 28px; color: #059669; opacity: 0.15; border: 4px solid #059669; padding: 2px 12px; transform: rotate(-12deg); border-radius: 8px; pointer-events: none; }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-7xl mx-auto mb-10 flex justify-center gap-4">
        <button id="btn-india" class="tab-btn active">India Portfolio</button>
        <button id="btn-wife" class="tab-btn">Wife's Portfolio</button>
        <button id="btn-singapore" class="tab-btn">Singapore</button>
    </div>

    <div id="policy-container" class="max-w-7xl mx-auto"></div>

    <script type="module">
        import { POLICY_DATA } from './data.js';
        const TODAY = new Date();

        function render(mode) {
            const container = document.getElementById('policy-container');
            const list = POLICY_DATA[mode];
            const currency = mode === 'singapore' ? '$' : '₹';

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');

            container.innerHTML = list.map(p => {
                const isPaidUp = p.dueDate === "PAID UP";
                const startYear = parseInt(p.commenced.split(' ')[2]);
                const maturityYear = parseInt(p.maturity.split(' ')[2]);
                const totalDuration = maturityYear - startYear;
                const premPct = (p.premiumYears / totalDuration) * 100;

                // Format Annual Income Payout Steps
                let incomeDetails = "Growth Phase";
                if (p.payoutSteps) {
                    incomeDetails = "Annual Income Period:\n" + p.payoutSteps.map(s => `Yrs ${s.years}: ${s.val}`).join('\n');
                } else if (p.income) {
                    incomeDetails = p.income;
                }

                // Growth calculation
                const endPremYear = startYear + p.premiumYears;
                const elapsedGrowth = Math.max(0, TODAY.getFullYear() - endPremYear);
                const totalGrowthYears = maturityYear - endPremYear;
                const growthProgress = Math.min(100, (elapsedGrowth / totalGrowthYears) * 100);

                return `
                <div class="policy-card open" style="border-color:${p.color}" id="card-${p.id}">
                    ${isPaidUp ? '<div class="paid-watermark">PAID UP</div>' : ''}
                    <div class="p-6 grid grid-cols-1 md:grid-cols-4 items-center gap-6">
                        <div class="flex items-center gap-4">
                            <img src="${p.logo}" class="w-12 h-12 object-contain">
                            <div>
                                <h2 class="font-black text-gray-800 leading-tight">${p.name}</h2>
                                <p class="text-[10px] text-gray-400 font-bold uppercase mt-1">ID: ${p.id}</p>
                            </div>
                        </div>
                        <div><p class="text-[10px] font-bold text-gray-400 uppercase">Sum Assured</p><p class="text-xl font-black text-blue-700">${currency} ${p.sumAssured.toLocaleString()}</p></div>
                        <div><p class="text-[10px] font-bold text-gray-400 uppercase">Premium</p><p class="text-xl font-black text-emerald-600">${currency} ${p.premium.toLocaleString()}</p></div>
                        <div class="text-right">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Next Due</p>
                            <p class="font-black ${isPaidUp ? 'text-emerald-600' : 'text-gray-900'}">${p.dueDate}</p>
                        </div>
                    </div>

                    <div class="content-area bg-gray-50 p-8 border-t">
                        <div class="flex h-5 mb-8 w-full items-center">
                            <div class="h-full flex" style="width: ${premPct}%">
                                ${Array.from({length: p.premiumYears}).map((_, i) => `
                                    <div class="flex-1 h-full bg-emerald-500 border-r border-white relative segment-container">
                                        <span class="tooltip-text text-xs">Year ${i+1} Premium</span>
                                    </div>
                                `).join('')}
                            </div>
                            
                            <div class="flex-1 h-full bg-gray-200 relative segment-container">
                                <span class="tooltip-text">${incomeDetails}</span>
                                <div class="absolute top-0 left-0 h-full bg-orange-400" style="width: ${growthProgress}%"></div>
                            </div>

                            <div class="relative ml-[-9px] maturity-wrapper segment-container" style="z-index: 60;">
                                <span class="tooltip-text tooltip-maturity">Maturity Benefit:\n${p.maturityAmt}</span>
                                <div class="payout-dot maturity-dot"></div>
                            </div>
                        </div>

                        <div class="flex justify-between text-[10px] font-black uppercase text-gray-500">
                            <div>Commenced: ${p.commenced}</div>
                            <div class="text-center">Premium End: ${p.premiumEnds}</div>
                            <div class="text-right">Maturity: ${p.maturity}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        ['india', 'wife', 'singapore'].forEach(mode => {
            document.getElementById(`btn-${mode}`).addEventListener('click', () => render(mode));
        });

        render('india');
    </script>
</body>
</html>
