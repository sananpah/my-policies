<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nami Insurance Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap');
        
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .maroon-text { color: #8b1d1d; }
        
        /* Requirement: Funky Border for Summary */
        .summary-card {
            background: white;
            border: 2px dashed #b91c1c;
            border-radius: 12px;
            box-shadow: 8px 8px 0px 0px rgba(185, 28, 28, 0.1);
        }

        .policy-card { 
            background: white;
            border-top: 2px solid; 
            border-left: 4px solid;
            border-right: 1px solid;
            border-bottom: 1px solid;
            border-radius: 4px;
        }

        .funky-title { font-family: 'Playfair Display', serif; }

        /* Requirement: Fixed Vertical Green Dividers */
        .vertical-divider {
            width: 2px;
            height: 18px;
            background-color: #22c55e;
            position: absolute;
            top: -6px;
            z-index: 10;
        }
        .start-line { left: 0; }
        .end-line { right: 0; }

        /* Requirement: Fixed Hover Functionality */
        .segment-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        .tooltip-text {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 180%;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            transition: opacity 0.2s;
            z-index: 50;
        }

        .chevron { transition: transform 0.3s ease; }
        .open .chevron { transform: rotate(180deg); }
        .content-area { display: none; }
        .open .content-area { display: block; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto mb-10 text-center">
        <h1 class="text-4xl font-bold maroon-text funky-title uppercase tracking-wider">Nami Insurance Portfolio</h1>
        <div class="h-1 w-24 bg-red-800 mx-auto mt-2 rounded-full"></div>
    </div>

    <div id="summary-bar" class="max-w-6xl mx-auto mb-10 grid grid-cols-1 md:grid-cols-2 gap-6"></div>

    <div id="policy-container" class="max-w-6xl mx-auto space-y-6"></div>

    <script>
        const myPolicies = [
            {
                name: "Nishchit Samrudhi Income lmtd",
                id: "54040166",
                type: "TRADITIONAL",
                sumAssured: "₹ 1,750,854.00",
                premium: "₹ 200,000.00",
                frequency: "Yearly",
                clientId: "62996974",
                uin: "121N142V01",
                dueDate: "10 Jan 2027",
                lastPaid: "10 Jan 2026",
                term: 28,
                commenced: "10 Jan 2022",
                premiumEnds: "10 Jan 2028",
                maturity: "10 Jan 2050",
                lastPaidYear: 2026,
                premiumYears: 7,
                color: "#b91c1c"
            },
            {
                name: "Reliance Guaranteed Money Back",
                id: "53044042",
                type: "TRADITIONAL",
                sumAssured: "₹ 1,23,940.00",
                premium: "₹ 14,400.00",
                frequency: "Yearly",
                clientId: "62996974",
                uin: "121N084V03",
                dueDate: "08 Sep 2026",
                lastPaid: "08 Sep 2025",
                term: 15,
                commenced: "08 Sep 2017",
                premiumEnds: "08 Sep 2026",
                maturity: "08 Sep 2032",
                lastPaidYear: 2025,
                premiumYears: 10,
                color: "#b91c1c"
            },
            {
                name: "HSBC Life Strategic Growth",
                id: "88273341",
                type: "UNIT LINKED",
                sumAssured: "₹ 5,00,000.00",
                premium: "₹ 50,000.00",
                frequency: "Yearly",
                clientId: "77221144",
                uin: "112L099V01",
                dueDate: "15 Mar 2026",
                lastPaid: "15 Mar 2024",
                term: 10,
                commenced: "15 Mar 2020",
                premiumEnds: "15 Mar 2025",
                maturity: "15 Mar 2030",
                lastPaidYear: 2024,
                premiumYears: 6,
                color: "#4c1d95"
            }
        ];

        function toggleCard(index) {
            document.getElementById(`card-${index}`).classList.toggle('open');
        }

        function render() {
            // Render Summary
            const totalSA = myPolicies.reduce((acc, p) => acc + parseFloat(p.sumAssured.replace(/[₹,]/g, '')), 0);
            const totalPrem = myPolicies.reduce((acc, p) => acc + parseFloat(p.premium.replace(/[₹,]/g, '')), 0);
            
            document.getElementById('summary-bar').innerHTML = `
                <div class="summary-card p-6 text-center bg-white">
                    <p class="text-[11px] uppercase font-bold text-gray-500 tracking-tighter">Total Portfolio Value</p>
                    <p class="text-3xl font-bold maroon-text mt-1">₹ ${totalSA.toLocaleString('en-IN')}</p>
                </div>
                <div class="summary-card p-6 text-center bg-white" style="border-color: #4c1d95; box-shadow: 8px 8px 0px 0px rgba(76, 29, 149, 0.1);">
                    <p class="text-[11px] uppercase font-bold text-gray-500 tracking-tighter">Total Annual Commitment</p>
                    <p class="text-3xl font-bold mt-1" style="color: #4c1d95;">₹ ${totalPrem.toLocaleString('en-IN')}</p>
                </div>
            `;

            // Render Policies
            const container = document.getElementById('policy-container');
            container.innerHTML = myPolicies.map((p, index) => {
                const startYear = parseInt(p.commenced.split(' ')[2]);
                let timelineHtml = `<div class="flex gap-1.5 w-full relative">`;
                
                for (let i = 0; i < p.term; i++) {
                    const currentYear = startYear + i;
                    const isPaid = currentYear <= p.lastPaidYear;
                    // Corrected: End line precisely at the end of the premium paying period
                    const isLastPremiumYear = (i + 1) === p.premiumYears; 
                    const isFinalYear = (i + 1) === p.term;
                    
                    timelineHtml += `
                        <div class="segment-container flex-1 h-1.5 rounded-sm relative ${isPaid ? 'bg-green-500' : 'bg-gray-200'}">
                            <span class="tooltip-text">Y${i+1} - ${currentYear}</span>
                            ${i === 0 ? '<div class="vertical-divider start-line"></div>' : ''}
                            ${isLastPremiumYear ? '<div class="vertical-divider end-line"></div>' : ''}
                            ${isFinalYear ? '<div class="vertical-divider end-line"></div>' : ''}
                        </div>`;
                }
                timelineHtml += `</div>`;

                return `
                <div id="card-${index}" class="policy-card shadow-md" style="border-color: ${p.color};">
                    <div class="p-6 flex justify-between items-center cursor-pointer" onclick="toggleCard(${index})">
                        <div class="flex items-center gap-4">
                            <svg class="chevron w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            <div>
                                <h2 class="text-xl font-bold text-gray-800 funky-title">${p.name}</h2>
                                <p class="text-xs text-gray-400 font-medium">${p.id} • ${p.type}</p>
                            </div>
                        </div>
                        <div class="flex gap-6 text-right items-center">
                            <div class="border-l border-gray-100 pl-4">
                                <p class="text-[9px] text-gray-400 uppercase font-bold">Sum Assured</p>
                                <p class="text-md font-bold maroon-text">${p.sumAssured}</p>
                            </div>
                            <div class="border-l border-gray-100 pl-4">
                                <p class="text-[9px] text-gray-400 uppercase font-bold">Premium</p>
                                <p class="text-md font-bold maroon-text">${p.premium}</p>
                            </div>
                        </div>
                    </div>

                    <div class="content-area">
                        <div class="px-10"><div class="h-[1px] w-full bg-gray-100"></div></div>
                        <div class="px-6 py-6 grid grid-cols-2 md:grid-cols-6 gap-6 text-[13px]">
                            <div>
                                <p class="text-gray-400 mb-1 font-semibold uppercase text-[10px]">Client ID</p>
                                <p class="font-bold text-gray-800 text-base">${p.clientId}</p>
                                <p class="text-gray-400 mt-2 italic text-[11px]">Last Premium Paid:</p>
                                <p class="font-bold text-gray-700">${p.lastPaid}</p>
                            </div>
                            <div><p class="text-gray-400 mb-1 font-semibold uppercase text-[10px]">UIN Number</p><p class="font-bold text-gray-800 text-base">${p.uin}</p></div>
                            <div><p class="text-gray-400 mb-1 font-semibold uppercase text-[10px]">Due Date</p><p class="font-bold text-gray-800 text-base">${p.dueDate}</p></div>
                            <div><p class="text-gray-400 mb-1 font-semibold uppercase text-[10px]">Policy Term</p><p class="font-bold text-gray-800 text-base">${p.term} Years</p></div>
                            <div><p class="text-gray-400 mb-1 font-semibold uppercase text-[10px]">Premium Ends</p><p class="font-bold text-gray-800 text-base">${p.premiumEnds}</p></div>
                            <div><p class="text-gray-400 mb-1 font-semibold uppercase text-[10px]">Maturity Date</p><p class="font-bold text-gray-800 text-base">${p.maturity}</p></div>
                        </div>

                        <div class="p-6 pb-10 bg-gray-50/30">
                            <p class="text-[10px] text-gray-400 mb-6 font-bold tracking-widest uppercase">Policy Timeline • ${p.frequency}</p>
                            ${timelineHtml}
                            <div class="flex justify-between mt-4 text-[10px] text-gray-400 font-bold uppercase tracking-tight">
                                <div>Commences<br><span class="text-gray-500 font-normal">${p.commenced}</span></div>
                                <div class="text-center">Premium Payment Ends<br><span class="text-gray-500 font-normal">${p.premiumEnds}</span></div>
                                <div class="text-right">Policy Maturity<br><span class="text-gray-500 font-normal">${p.maturity}</span></div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
        render();
    </script>
</body>
</html>
