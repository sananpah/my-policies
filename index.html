<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nami Portfolio v3.5.85</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="india_styles.css">
    <style>
        .build-tag { 
            position: fixed; top: 20px; right: 20px; 
            font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 900;
            background: #1e293b; color: #6366f1; padding: 8px 16px; 
            border-radius: 99px; border: 1px solid #334155; z-index: 1000;
        }
         
        @keyframes alert-glow { 0% { box-shadow: 0 0 5px #dc2626; background: #dc2626; } 50% { box-shadow: 0 0 20px #ef4444; background: #b91c1c; } 100% { box-shadow: 0 0 5px #dc2626; background: #dc2626; } }
        .due-blink { animation: alert-glow 1.5s infinite ease-in-out !important; color: white !important; border: none !important; }

        .content-area { display: none; padding: 40px; border-top: 1px solid #f1f5f9; background: #fafbfc; border-radius: 0 0 24px 0; }
        .open .content-area { display: block; }

        .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; background: #f1f5f9; padding: 15px 25px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .detail-item p:first-child { font-size: 9px; font-weight: 900; text-transform: uppercase; color: #64748b; margin-bottom: 2px; }
        .detail-item p:last-child { font-family: 'Orbitron', sans-serif; font-size: 13px; color: #1e293b; letter-spacing: 0.5px; }

        .bg-prem-past { background: #064e3b; } 
        .bg-prem-future { background: #10b981; }
        .bg-current { background: #22c55e; box-shadow: 0 0 20px rgba(34,197,94,0.6); border: 3px solid white; z-index: 10; }
        .bg-history-brown { background: #78350f; } 
        .bg-future-light-brown { background: #b45309; } 
        .bg-payout-past { background: #d97706; } 
        .bg-payout-future { background: #f59e0b; } 
        .bg-hybrid { background: linear-gradient(to bottom, #10b981 50%, #f59e0b 50%); }

        .mat-star { flex: 0 0 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #f59e0b; cursor: help; position: relative; transition: 0.3s; }
        .mat-star:hover { transform: scale(1.5) rotate(15deg); color: #fbbf24; }

        .funky-badge {
            font-family: 'Orbitron', sans-serif; font-size: 9px; font-weight: 900; padding: 8px 14px; border-radius: 12px;
            text-transform: uppercase; letter-spacing: 1px; background: rgba(15, 23, 42, 0.9); color: #fff;
            border: 2px solid; box-shadow: 0 4px 15px rgba(0,0,0,0.2), inset 0 0 10px rgba(255,255,255,0.1);
            position: relative; overflow: hidden; min-width: 120px; text-align: center;
        }
        .funky-badge::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg); animation: sweep 3s infinite linear;
        }
        @keyframes sweep { 0% { left: -100%; } 100% { left: 100%; } }

        .paid-logo { width: 110px; transform: rotate(-5deg); filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.4)); }
    </style>
</head>
<body>

    <div class="build-tag">BUILD ID: v3.5.85</div>

    <div class="max-w-7xl mx-auto mb-10">
        <h1 class="brand-header">Nami Portfolio</h1>
        <div class="flex gap-4 mb-8">
            <button onclick="render('india')" class="px-8 py-3 bg-slate-800 text-white rounded-full font-bold hover:bg-slate-700 transition">India</button>
            <button onclick="render('singapore')" class="px-8 py-3 bg-slate-800 text-white rounded-full font-bold hover:bg-slate-700 transition">Singapore</button>
        </div>
        
        <div id="summary-bar" class="grid grid-cols-3 gap-6 bg-slate-900 p-8 rounded-[32px] text-white shadow-2xl">
            <div class="border-r border-slate-700 text-center"><p class="text-[10px] font-bold text-slate-400 uppercase">Total Sum Assured</p><p id="total-sa" class="text-4xl font-black text-emerald-400">0</p></div>
            <div class="border-r border-slate-700 text-center"><p class="text-[10px] font-bold text-slate-400 uppercase">Annual Premium</p><p id="total-premium" class="text-4xl font-black text-indigo-400">0</p></div>
            <div class="text-center"><p class="text-[10px] font-bold text-slate-400 uppercase">Policies Due</p><p id="due-count" class="text-4xl font-black text-orange-400">0</p></div>
        </div>
    </div>

    <div id="container" class="max-w-7xl mx-auto"></div>

    <script type="module">
        import { POLICY_DATA } from './data.js?v=3.5.83';

        const TODAY = new Date();
        const CURRENT_YEAR = TODAY.getFullYear();

        window.toggleCard = (id) => {
            const card = document.getElementById(`card-${id}`);
            const wasOpen = card.classList.contains('open');
            document.querySelectorAll('.policy-card').forEach(c => c.classList.remove('open'));
            if (!wasOpen) card.classList.add('open');
        };

        function checkIsDueSoon(dueDateStr) {
            if (!dueDateStr || dueDateStr === "PAID UP") return false;
            const parts = dueDateStr.split(' '); 
            const due = new Date(`${parts[1]} ${parts[0]}, ${parts[2]}`);
            const diff = (due - TODAY) / 86400000;
            return diff >= 0 && diff <= 30;
        }

        function getTimeLeft(endDateStr) {
            if (!endDateStr || endDateStr === "PAID UP") return null;
            const parts = endDateStr.split(' ');
            const end = new Date(`${parts[1]} ${parts[0]}, ${parts[2]}`);
            let years = end.getFullYear() - TODAY.getFullYear();
            let months = end.getMonth() - TODAY.getMonth();
            if (months < 0) { years--; months += 12; }
            if (years < 0) return null;
            return `${String(years).padStart(2, '0')}y${String(months).padStart(2, '0')}m`;
        }

        function autoFmt(val, sym) {
            if (val === undefined || val === null) return sym + "0";
            const clean = String(val).replace(/[₹$,\s]/g, "");
            const num = parseFloat(clean);
            return isNaN(num) ? val : sym + num.toLocaleString();
        }

        function raw(val) { return (val === undefined || val === null) ? "" : val; }

        function toNum(val) {
            if(!val) return 0;
            const clean = String(val).replace(/[₹$,\s]/g, "");
            const n = parseFloat(clean);
            return isNaN(n) ? 0 : n;
        }

        window.render = function(cat) {
            const list = POLICY_DATA[cat] || [];
            const sym = (cat === 'singapore') ? "$" : "₹";

            document.getElementById('container').innerHTML = list.map(p => {
                const startParts = p.commenced.split(' ');
                const startY = parseInt(startParts[2]);
                const anniversaryDay = parseInt(startParts[0]);
                const anniversaryMonth = startParts[1]; // e.g. "Feb"
                
                const matY = parseInt(p.maturity.split(' ')[2]);
                const premEndYear = parseInt(p.premiumEnds.split(' ')[2]);
                const isPaidUp = p.dueDate === "PAID UP";
                const timeLeft = getTimeLeft(p.premiumEnds);
                
                // Determine if this year's anniversary has passed
                const currentAnniversary = new Date(`${anniversaryMonth} ${anniversaryDay}, ${CURRENT_YEAR}`);
                const hasPassedThisYear = TODAY > currentAnniversary;

                let timelineHtml = '';
                for(let yr = startY; yr < matY; yr++) {
                    const polY = yr - startY + 1;
                    const isPast = yr < CURRENT_YEAR;
                    const isCurrent = yr === CURRENT_YEAR;
                    let color = "", phase = "", detail = "";

                    if (yr <= premEndYear) {
                        // If current year and anniversary passed, treat as "past" (Paid)
                        const isEffectivelyPaid = isPast || isPaidUp || (isCurrent && hasPassedThisYear);
                        
                        if (p.name.includes("Fortune Maximiser") && polY >= (p.bonusStartYear || 2)) {
                            color = "bg-hybrid"; phase = "Premium + Bonus";
                            detail = `Prem: ${autoFmt(p.premium, sym)} + Bonus`;
                        } else {
                            // Only show bright glow if it's the current year AND the anniversary hasn't passed yet
                            color = (isCurrent && !hasPassedThisYear && !isPaidUp) ? "bg-current" : (isEffectivelyPaid ? "bg-prem-past" : "bg-prem-future");
                            phase = isEffectivelyPaid ? "Premium Completed" : "Premium Payment";
                            detail = `Amt: ${autoFmt(p.premium, sym)}`;
                        }
                    } 
                    else if (p.name.includes("Nishchit Pension") && polY === 7) {
                        color = isPast ? "bg-history-brown" : "bg-future-light-brown";
                        phase = "Deferment Year"; detail = "Wealth Locked";
                    }
                    else {
                        const payout = (p.payoutSchedule && p.payoutSchedule[polY]) || p.annualPayout;
                        if (payout) {
                            color = isPast ? "bg-payout-past" : "bg-payout-future";
                            phase = isPast ? "Payout Received" : "Income Phase";
                            detail = `Payout: ${autoFmt(payout, sym)}`;
                        } else {
                            color = isPast ? "bg-history-brown" : "bg-future-light-brown";
                            phase = isPast ? "Growth (Historical)" : "Growth Phase";
                            detail = "Accumulating Value";
                        }
                    }
                    timelineHtml += `<div class="segment ${color}"><div class="tooltip"><b class="text-emerald-400 uppercase tracking-tighter">${phase}</b><br>${detail}<br><span class="opacity-40 text-[9px]">Year ${polY} (${yr})</span></div></div>`;
                }

                timelineHtml += `<div class="mat-star">★<div class="tooltip"><b class="text-orange-400 uppercase tracking-widest">Maturity</b><br><span class="${String(p.maturityAmt || p.sumAssured).length > 15 ? 'text-[10px]' : 'text-lg'} font-black">${raw(p.maturityAmt || p.sumAssured)}</span></div></div>`;

                return `
                <div class="policy-card" id="card-${p.id}" style="border-color: ${p.color}">
                    <div class="card-header" onclick="toggleCard('${p.id}')">
                        <div class="w-32 flex justify-center"><img src="${p.logo}" class="max-h-12"></div>
                        <div class="flex-1 ml-10">
                            <h3 class="font-black text-slate-800 text-xl tracking-tight flex items-center">
                                ${p.name}
                                ${p.isWife ? `<span class="family-marker" title="Wife's Policy"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm8.94 14c-.46-4.17-3.97-7.41-8.19-7.41s-7.73 3.24-8.19 7.41c-.02.21.11.41.32.41H20.62c.21 0 .34-.2.32-.41z"/></svg></span>` : ''}
                                ${p.isDaughter ? `<span class="family-marker" title="Daughter's Policy"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M8 8s.5-2 1-2 1 2 1 2"/><path d="M14 8s.5-2 1-2 1 2 1 2"/></svg></span>` : ''}
                            </h3>
                        </div>
                        <div class="flex gap-12 items-center mr-10">
                            <div class="flex items-center w-[300px] -ml-12">
                                <div class="funky-badge" style="border-color: ${p.color}; box-shadow: 0 0 10px ${p.color}44;">${p.type}</div>
                                <div class="ml-6"><p class="text-[9px] font-bold text-slate-400 uppercase">Sum Assured</p><p class="text-lg font-black text-slate-700">${autoFmt(p.sumAssured, sym)}</p></div>
                            </div>
                            <div class="text-center border-l-2 border-slate-100 pl-10">
                                <p class="text-[9px] font-bold text-slate-400 uppercase">Annual Premium</p>
                                <p class="text-lg font-black ${isPaidUp ? 'text-slate-300 line-through' : 'text-emerald-600'}">${autoFmt(p.premium, sym)}</p>
                                ${timeLeft ? `<p class="text-[10px] font-bold text-slate-400 tracking-tighter mt-[-2px]">${timeLeft}</p>` : ''}
                            </div>
                        </div>
                        <div class="w-44 text-center">
                            <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Next Due Date</p>
                            ${isPaidUp ? `<img src="paid.jpg" class="paid-logo mx-auto">` : 
                            `<div class="px-6 py-3 rounded-xl font-black text-xs text-center shadow-lg ${checkIsDueSoon(p.dueDate) ? 'due-blink' : 'bg-slate-900 text-white'}">${p.dueDate}</div>`}
                        </div>
                    </div>
                    <div class="content-area">
                        <div class="detail-grid">
                            <div class="detail-item"><p>Policy Number</p><p>${p.id || 'N/A'}</p></div>
                            <div class="detail-item"><p>Client ID</p><p>${p.clientId || 'N/A'}</p></div>
                            <div class="detail-item"><p>UIN</p><p>${p.uin || 'N/A'}</p></div>
                        </div>
                        <div class="timeline-track">
                            <div class="absolute -top-8 left-0 text-[11px] font-black text-slate-400 uppercase">${p.commenced}</div>
                            ${timelineHtml}
                            <div class="absolute -top-8 right-0 text-[11px] font-black text-slate-400 uppercase">${p.maturity}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            const tSA = list.reduce((acc, p) => acc + toNum(p.sumAssured), 0);
            const tAnn = list.reduce((acc, p) => acc + (p.dueDate !== "PAID UP" ? toNum(p.premium) : 0), 0);
            document.getElementById('total-sa').innerText = sym + tSA.toLocaleString();
            document.getElementById('total-premium').innerText = sym + tAnn.toLocaleString();
            document.getElementById('due-count').innerText = list.filter(p => checkIsDueSoon(p.dueDate)).length;
        }

        render('india');
    </script>
</body>
</html>
