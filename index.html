<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; }
        
        .policy-card { 
            position: relative; background: white; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; 
            border-top: 5px solid; margin-bottom: 2rem;
        }

        /* Paid Up Badge */
        .paid-badge {
            position: absolute; top: 15px; right: 15px;
            border: 2px solid #10b981; color: #10b981;
            padding: 2px 8px; border-radius: 4px; font-weight: 900;
            font-size: 12px; transform: rotate(5deg); background: rgba(16, 185, 129, 0.05);
        }

        /* Improved Tooltip */
        .segment { position: relative; cursor: pointer; height: 100%; }
        .tooltip {
            visibility: hidden; opacity: 0; position: absolute;
            bottom: 125%; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 12px;
            border-radius: 6px; font-size: 11px; z-index: 100;
            width: 220px; text-align: center; transition: 0.2s;
            pointer-events: none; white-space: pre-line;
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
        }
        .segment:hover .tooltip { visibility: visible; opacity: 1; transform: translate(-50%, -5px); }

        /* Timeline Markers */
        .marker-line { position: absolute; top: 0; bottom: -25px; width: 2px; background: #e2e8f0; }
        .marker-label { position: absolute; top: 30px; font-size: 10px; font-weight: 700; color: #64748b; white-space: nowrap; transform: translateX(-50%); }

        .tab-btn { padding: 8px 20px; font-weight: 700; font-size: 12px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; transition: 0.2s; }
        .tab-btn.active { background: #1e293b; color: white; border-color: #1e293b; }
    </style>
</head>
<body class="p-8">

    <div class="max-w-6xl mx-auto flex justify-center gap-3 mb-12">
        <button id="btn-india" class="tab-btn active" onclick="render('india')">INDIA</button>
        <button id="btn-wife" class="tab-btn" onclick="render('wife')">WIFE</button>
        <button id="btn-singapore" class="tab-btn" onclick="render('singapore')">SINGAPORE</button>
    </div>

    <div id="container" class="max-w-6xl mx-auto"></div>

    <script type="module">
        import { POLICY_DATA } from './data.js';

        window.render = function(category) {
            const container = document.getElementById('container');
            const policies = POLICY_DATA[category];
            
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${category}`).classList.add('active');

            container.innerHTML = policies.map(p => {
                const start = parseInt(p.commenced.split(' ')[2]);
                const maturity = parseInt(p.maturity.split(' ')[2]);
                const totalYrs = maturity - start;
                const premPct = (p.premiumYears / totalYrs) * 100;
                
                // Format the Income Tooltip
                let incomeText = "Growth Period";
                if (p.payoutSteps) {
                    incomeText = "ANNUAL INCOME SCHEDULE:\n" + p.payoutSteps.map(s => `${s.years} Yrs: ${s.val}`).join('\n');
                } else if (p.income) {
                    incomeText = p.income;
                }

                return `
                <div class="policy-card" style="border-color: ${p.color}">
                    ${p.dueDate === "PAID UP" ? '<div class="paid-badge">PAID UP</div>' : ''}
                    
                    <div class="p-6 grid grid-cols-4 gap-4 items-center">
                        <div class="flex items-center gap-4">
                            <img src="${p.logo}" class="w-10 h-10 object-contain">
                            <div>
                                <h3 class="font-black text-slate-800 text-sm">${p.name}</h3>
                                <p class="text-[10px] text-slate-400 font-bold uppercase">ID: ${p.id}</p>
                            </div>
                        </div>
                        <div>
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-wider">Sum Assured</p>
                            <p class="text-lg font-black text-indigo-700">₹ ${p.sumAssured.toLocaleString()}</p>
                        </div>
                        <div>
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-wider">Premium</p>
                            <p class="text-lg font-black text-emerald-600">₹ ${p.premium.toLocaleString()}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-wider">Next Due</p>
                            <p class="font-black text-slate-800">${p.dueDate}</p>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-10 pb-16">
                        <div class="relative h-4 w-full bg-slate-200 rounded-full flex">
                            
                            <div class="h-full bg-emerald-500 rounded-l-full flex" style="width: ${premPct}%">
                                ${Array.from({length: p.premiumYears}).map((_, i) => `
                                    <div class="segment flex-1 border-r border-white/20">
                                        <div class="tooltip font-bold text-[10px]">Premium Year ${i+1}</div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="segment flex-1 bg-orange-400 rounded-r-full">
                                <div class="tooltip font-bold text-[10px]">${incomeText}</div>
                            </div>

                            <div class="marker-line" style="left: 0;"></div>
                            <div class="marker-label" style="left: 0;">${p.commenced}</div>

                            <div class="marker-line" style="left: ${premPct}%; background: #10b981;"></div>
                            <div class="marker-label" style="left: ${premPct}%; color: #10b981;">${p.premiumEnds}</div>

                            <div class="marker-line" style="left: 100%; background: #ef4444;"></div>
                            <div class="marker-label" style="left: 100%; color: #ef4444;">${p.maturity}</div>

                            <div class="segment" style="position: absolute; right: -8px; top: -4px; z-index: 50;">
                                <div class="tooltip font-bold text-[10px]">MATURITY BENEFIT:\n${p.maturityAmt}</div>
                                <div class="w-6 h-6 bg-red-600 border-4 border-white rounded-full shadow-lg"></div>
                            </div>

                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // Initial Load
        render('india');
    </script>
</body>
</html>
