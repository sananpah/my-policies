<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nami Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>

    <header class="top-bar">
        <div class="top-bar-inner max-container">
            <div class="brand">
                <div class="brand-mark">N</div>
                <div class="brand-text">
                    <h1 class="brand-name">Nami Portfolio</h1>
                    <p class="brand-sub">Insurance &amp; Investment Tracker</p>
                </div>
            </div>
            <div class="header-right">
                <div class="sync-status" id="sync-status">
                    <span class="sync-dot"></span>
                    <span class="sync-label">Syncing…</span>
                </div>
                <span class="version-tag" id="version-tag">v4.1</span>
            </div>
        </div>
    </header>

    <nav class="nav-bar">
        <div class="nav-inner max-container">
            <div class="tab-group">
                <button class="tab active" data-cat="india" onclick="switchTab('india')">
                    <img src="https://flagcdn.com/w40/in.png" class="flag" alt="">
                    <span>India</span>
                </button>
                <button class="tab" data-cat="singapore" onclick="switchTab('singapore')">
                    <img src="https://flagcdn.com/w40/sg.png" class="flag" alt="">
                    <span>Singapore</span>
                </button>
                <button class="tab tab-health" data-cat="health" onclick="switchTab('health')">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12h6M12 9v6"/></svg>
                    <span>Health</span>
                </button>
            </div>
            <div class="sort-group" id="sort-group">
                <span class="sort-label">Sort by</span>
                <select id="sort-trigger" onchange="render(window.currentCategory)" class="sort-select">
                    <option value="default">Default</option>
                    <option value="premium">Premium ↓</option>
                    <option value="time">Maturity (Soonest)</option>
                    <option value="due">Due (Earliest)</option>
                </select>
            </div>
        </div>
    </nav>

    <div class="summary-strip">
        <div class="max-container">
            <div class="summary-inner" id="summary-inner">
                <div class="summary-item">
                    <span class="summary-lbl">Sum Assured</span>
                    <span class="summary-val clr-emerald" id="total-sa">—</span>
                </div>
                <div class="summary-sep"></div>
                <div class="summary-item">
                    <span class="summary-lbl">Annual Premium</span>
                    <span class="summary-val clr-indigo" id="total-premium">—</span>
                </div>
                <div class="summary-sep"></div>
                <div class="summary-item">
                    <span class="summary-lbl">Portfolio Value</span>
                    <span class="summary-val clr-rose" id="total-unit-value">—</span>
                </div>
            </div>
            <div id="family-row"></div>
        </div>
    </div>

    <main class="main-content">
        <div class="max-container">
            <div id="container"></div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
