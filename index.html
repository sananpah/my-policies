<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nami Insurance Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="dashboard-header">
        <div class="build-info">Build: 2026.03.08.01</div>
        <h1>Nami Insurance Portfolio</h1>
        <p id="last-updated-display">Last Updated: Loading...</p>
    </header>

    <main id="policy-container" class="container">
        </main>

    <script type="module">
        import { POLICY_DATA } from './data.js';

        // Auto-update the "Last Updated" date to today
        const today = new Date();
        const dateOptions = { year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('last-updated-display').innerText = `Last Updated: ${today.toLocaleDateString('en-GB', dateOptions)}`;

        const container = document.getElementById('policy-container');

        function renderPortfolio(regionKey, regionLabel) {
            const section = document.createElement('section');
            section.innerHTML = `<h2 class="region-title">${regionLabel}</h2>`;
            
            const grid = document.createElement('div');
            grid.className = 'policy-grid';

            POLICY_DATA[regionKey].forEach(policy => {
                const isPaidUp = policy.dueDate === "PAID UP";
                const currency = policy.currency || (regionKey === 'india' ? '₹' : '$');
                
                grid.innerHTML += `
                    <div class="policy-card" style="border-top: 5px solid ${policy.color}">
                        <div class="card-header">
                            <span class="policy-name">${policy.name}</span>
                            <span class="type-badge type-${policy.type.toLowerCase()}">${policy.type}</span>
                        </div>
                        
                        <div class="card-body">
                            <div class="stat"><span class="label">ID</span> <span class="val">${policy.id}</span></div>
                            <div class="stat"><span class="label">Sum Assured</span> <span class="val">${currency} ${policy.sumAssured.toLocaleString()}</span></div>
                            ${policy.income ? `<div class="stat income-highlight"><span class="label">Payout</span> <span class="val">${policy.income}</span></div>` : ''}
                        </div>

                        <div class="card-footer">
                            <span class="${isPaidUp ? 'status-paid' : 'status-due'}">
                                ${isPaidUp ? 'FULLY PAID' : 'Next Due: ' + policy.dueDate}
                            </span>
                        </div>
                    </div>
                `;
            });
            section.appendChild(grid);
            container.appendChild(section);
        }

        renderPortfolio('india', 'India Portfolio');
        renderPortfolio('singapore', 'Singapore Portfolio');
        renderPortfolio('wife', 'Spouse Portfolio');
    </script>
</body>
</html>
