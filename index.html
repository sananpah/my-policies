<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nami Portfolio v3.5.49</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Inter:wght@400;700;900&display=swap');
        
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; padding: 40px; }
        .brand-header { font-family: 'Orbitron', sans-serif; background: linear-gradient(90deg, #6366f1, #ec4899, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 3.5rem; font-weight: 900; text-transform: uppercase; }
        
        /* THE BLINK FIX */
        @keyframes alert-glow { 0% { box-shadow: 0 0 5px #dc2626; background: #dc2626; } 50% { box-shadow: 0 0 20px #ef4444; background: #b91c1c; } 100% { box-shadow: 0 0 5px #dc2626; background: #dc2626; } }
        .due-blink { animation: alert-glow 1.5s infinite ease-in-out !important; color: white !important; }

        /* CARD STYLING */
        .policy-card { background: white; border-radius: 24px; border-left: 16px solid; margin-bottom: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); transition: 0.3s; position: relative; z-index: 1; }
        .policy-card.open { z-index: 50; } 
        .card-header { cursor: pointer; display: flex; align-items: center; padding: 30px 40px; min-height: 120px; }
        .content-area { display: none; padding: 35px; border-top: 1px solid #f1f5f9; background: #fafbfc; border-radius: 0 0 24px 0; overflow: visible !important; }
        .open .content-area { display: block; }

        /* BADGES */
        .badge-base { font-family: 'Orbitron', sans-serif; font-size: 8px; font-weight: 900; padding: 6px 12px; border-radius: 10px; text-transform: uppercase; color: white; min-width: 110px; text-align: center; }
        .badge-saving { background: linear-gradient(135deg, #00ff88, #00ad5f); }
        .badge-retirement { background: linear-gradient(135deg, #ffcc00, #ff8800); }
        
        /* TIMELINE & STAR */
        .timeline-track { position: relative; height: 40px; background: #e2e8f0; border-radius: 20px; display: flex; padding: 0 6px; align-items: center; margin-top: 60px; overflow: visible !important; }
        .segment { height: 32px; flex: 1; margin: 0 1px; border-radius: 4px; position: relative; cursor: help; transition: 0.2s; }
        .segment:hover { transform: scaleY(1.3); z-index: 1000 !important; }
        
        /* STAR STYLING */
        .mat-star { 
            flex: 0 0 40px; height: 40px; display: flex; align-items: center; justify-content: center; 
            font-size: 24px; cursor: help; position: relative; transition: 0.3s; color: #f59e0b; 
            filter: drop-shadow(0 0 5px rgba(245, 158, 11, 0.5));
        }
        .mat-star:hover { transform: scale(1.5) rotate(15deg); z-index: 1000 !important; color: #fbbf24; }

        /* TOOLTIP */
        .tooltip { 
            visibility: hidden; opacity: 0; position: absolute; 
            bottom: 55px; left: 50%; transform: translateX(-50%); 
            background: #0f172a; color: white; padding: 14px; border-radius: 12px; 
            width: 240px; text-align: center; font-size: 11px; z-index: 10000;
            pointer-events: none; line-height: 1.5; transition: 0.2s;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        .segment:hover .tooltip, .mat-star:hover .tooltip { visibility: visible; opacity: 1; bottom: 50px; }
        .tooltip::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px; border-width: 6px; border-style: solid; border-color: #0f172a transparent transparent transparent; }

        /* COLORS */
        .bg-prem-past { background: #064e3b; }
        .bg-prem-future { background: #10b981; }
        .bg-current { background: #22c55e; box-shadow: 0 0 20px rgba(34,197,94,0.6); border: 3px solid white; }
        .bg-orange-phase { background: #f59e0b; }
        .bg-wait-phase { background: #78350f; }

        .paid-logo { width: 110px; filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.8)); transform: rotate(-5deg); }
    </style>
</head>
<body>

    <div class="max-w-7xl mx-auto mb-10">
        <h1 class="brand-header">Nami Portfolio</h1>
        <div id="summary-bar" class="grid grid-cols-3 gap-6 mt-8 bg-slate-900 p-8 rounded-[32px] text-white shadow-2xl">
            <div class="border-r border-slate-700 text-center"><p class="text-[10px] font-bold text-slate-400 uppercase">Sum Assured</p><p id="total-sa" class="text-4xl font-black text-emerald-400">₹0</p></div>
            <div class="border-r border-slate-700 text-center"><p class="text-[10px] font-bold text-slate-400 uppercase">Annual Premium</p><p id="total-premium" class="text-4xl font-black text-indigo-400">₹0</p></div>
            <div class="text-center"><p class="text-[10px] font-bold text-slate-400 uppercase">Due Soon</p><p id="due-count" class="text-4xl font-black text-orange-400">0</p></div>
        </div>
    </div>

    <div id="container" class="max-w-7xl mx-auto"></div>

    <script type="module">
        import { POLICY_DATA } from './data.js';

        const TODAY = new Date();
        window.toggleCard = (id) => {
            const card = document.getElementById(`card-${id}`);
            const isOpen = card.classList.contains('open');
            document.querySelectorAll('.policy-card').forEach(c => c.classList.remove('open'));
            if (!isOpen) card.classList.add('open');
        };

        function checkIsDueSoon(dueDateStr) {
            if (!dueDateStr || dueDateStr === "PAID UP") return false;
            const parts = dueDateStr.split(' '); 
            const due = new Date(`${parts[1]} ${parts[0]}, ${parts[2]}`);
            const diff = (due - TODAY) / 86400000;
            return diff >= 0 && diff <= 30;
        }

        window.render = function(cat) {
            const list = POLICY_DATA[cat] || [];
            const sym = list[0]?.currency || "₹";

            document.getElementById('container').innerHTML = list.map(p => {
                const startY = parseInt(p.commenced.split(' ')[2]);
                const matY = parseInt(p.maturity.split(' ')[2]);
                const premEndYear = parseInt(p.premiumEnds.split(' ')[2]);
                const isDueSoon = checkIsDueSoon(p.dueDate);
                
                let timelineHtml = '';
                // LOOP UNTIL YEAR BEFORE MATURITY
                for(let yr = startY; yr < matY; yr++) {
                    const polY = yr - startY + 1;
                    let color = "", phase = "", detail = "";

                    if (yr <= premEndYear) {
                        const isDone = yr < TODAY.getFullYear() || p.dueDate === "PAID UP";
                        color = isDone ? "bg-prem-past" : (yr === TODAY.getFullYear() ? "bg-current" : "bg-prem-future");
                        phase = "Premium Payment";
                        detail = `Due: ${sym}${p.premium.toLocaleString()}`;
                    } else if (p.name.includes("Nishchit Pension") && yr === (premEndYear + 1)) {
                        color = "bg-wait-phase"; phase = "Deferred Year"; detail = "Accumulation phase";
                    } else {
                        let payoutAmt = p.annualPayout || (p.payoutSchedule && p.payoutSchedule[polY]);
                        color = "bg-orange-phase";
                        phase = payoutAmt ? "Income Phase" : "Growth Phase";
                        detail = payoutAmt ? `Annual: ${sym}${payoutAmt.toLocaleString()}` : "Wealth Growth";
                    }

                    timelineHtml += `
                        <div class="segment ${color}">
                            <div class="tooltip"><b class="text-emerald-400 uppercase">${phase}</b><br>${detail}<br><span class="opacity-40 text-[9px]">Year ${polY} (${yr})</span></div>
                        </div>`;
                }

                // THE MATURITY STAR
                const maturityValue = p.maturityAmount || p.sumAssured; 
                timelineHtml += `
                    <div class="mat-star">
                        ★
                        <div class="tooltip">
                            <b class="text-orange-400 uppercase">Final Maturity</b><br>
                            Estimated: ${sym}${maturityValue.toLocaleString()}<br>
                            <span class="opacity-40 text-[9px]">Year ${matY - startY + 1} (${matY})</span>
                        </div>
                    </div>`;

                return `
                <div class="policy-card" id="card-${p.id}" style="border-color: ${p.color}">
                    <div class="card-header" onclick="toggleCard('${p.id}')">
                        <div class="w-32 flex justify-center"><img src="${p.logo}" class="max-h-12"></div>
                        <div class="flex-1 ml-10"><h3 class="font-black text-slate-800 text-xl tracking-tight">${p.name}</h3></div>
                        <div class="flex gap-12 items-center mr-10">
                            <div class="flex items-center w-[300px] -ml-12">
                                <div class="badge-base ${p.type.toLowerCase().includes('retirement') ? 'badge-retirement' : 'badge-saving'}">${p.type}</div>
                                <div class="ml-6"><p class="text-[9px] font-bold text-slate-400 uppercase">Sum Assured</p><p class="text-lg font-black text-slate-700">${sym}${p.sumAssured.toLocaleString()}</p></div>
                            </div>
                            <div class="text-center border-l-2 border-slate-100 pl-10">
                                <p class="text-[9px] font-bold text-slate-400 uppercase">Annual Premium</p>
                                <p class="text-lg font-black text-emerald-600">${sym}${p.premium.toLocaleString()}</p>
                            </div>
                        </div>
                        <div class="w-44">
                            ${p.dueDate === "PAID UP" ? `<img src="paid.jpg" class="paid-logo mx-auto">` : 
                            `<div class="px-6 py-3 rounded-xl font-black text-xs text-center shadow-lg ${isDueSoon ? 'due-blink' : 'bg-slate-900 text-white'}">${p.dueDate}</div>`}
                        </div>
                    </div>
                    <div class="content-area">
                        <div class="timeline-track">
                            <div class="absolute -top-8 left-0 text-[11px] font-black text-slate-400">${p.commenced}</div>
                            ${timelineHtml}
                            <div class="absolute -top-8 right-0 text-[11px] font-black text-slate-400">${p.maturity}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            updateSummary(list, sym);
        }

        function updateSummary(list, sym) {
            const totalSA = list.reduce((acc, p) => acc + (p.sumAssured || 0), 0);
            const totalAnnual = list.reduce((acc, p) => acc + (p.dueDate !== "PAID UP" ? p.premium : 0), 0);
            document.getElementById('total-sa').innerText = `${sym}${totalSA.toLocaleString()}`;
            document.getElementById('total-premium').innerText = `${sym}${totalAnnual.toLocaleString()}`;
            document.getElementById('due-count').innerText = list.filter(p => checkIsDueSoon(p.dueDate)).length;
        }

        render('india');
    </script>
</body>
</html>
