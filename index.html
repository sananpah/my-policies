<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nami Portfolio v3.5.87</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Inter:wght@400;700;900&display=swap');
        
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; padding: 40px; position: relative; }
        
        .build-tag { 
            position: fixed; top: 20px; right: 20px; 
            font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 900;
            background: #1e293b; color: #6366f1; padding: 8px 16px; 
            border-radius: 99px; border: 1px solid #334155; z-index: 1000;
        }

        .brand-header { font-family: 'Orbitron', sans-serif; background: linear-gradient(90deg, #6366f1, #ec4899, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 3.5rem; font-weight: 900; text-transform: uppercase; margin-bottom: 30px; }
        
        /* Shared Dashboard Components */
        .policy-card { background: white; border-radius: 24px; border-left: 16px solid; margin-bottom: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); transition: 0.3s; overflow: hidden; }
        .card-header { cursor: pointer; display: flex; align-items: center; padding: 30px 40px; min-height: 120px; }
        .content-area { display: none; padding: 40px; border-top: 1px solid #f1f5f9; background: #fafbfc; }
        .open .content-area { display: block; }

        /* Timeline Styling */
        .timeline-track { position: relative; height: 44px; background: #e2e8f0; border-radius: 22px; display: flex; padding: 0 6px; align-items: center; margin-top: 60px; }
        .segment { height: 36px; flex: 1; margin: 0 1px; border-radius: 4px; position: relative; cursor: help; transition: 0.2s; }
        
        /* Shared Colors */
        .bg-current { background: #22c55e; box-shadow: 0 0 20px rgba(34,197,94,0.6); border: 2px solid white; z-index: 10; }
        .bg-prem-past { background: #064e3b; } /* Dark Green - Anniversary Passed */
        .bg-prem-future { background: #10b981; }
        
        .tooltip { 
            visibility: hidden; opacity: 0; position: absolute; bottom: 65px; left: 50%; transform: translateX(-50%); 
            background: #0f172a; color: white; padding: 12px; border-radius: 12px; width: 180px; 
            text-align: center; font-size: 11px; z-index: 1000; transition: 0.3s; pointer-events: none;
        }
        .segment:hover .tooltip { visibility: visible; opacity: 1; bottom: 55px; }

        .funky-badge {
            font-family: 'Orbitron', sans-serif; font-size: 9px; font-weight: 900; padding: 8px 14px; border-radius: 12px;
            text-transform: uppercase; background: rgba(15, 23, 42, 0.9); color: #fff; border: 2px solid;
        }
    </style>
</head>
<body>

    <div class="build-tag">BUILD ID: v3.5.87.DYNAMIC</div>

    <div class="max-w-7xl mx-auto mb-10">
        <h1 class="brand-header">Nami Portfolio</h1>
        
        <div class="flex gap-4 mb-8">
            <button onclick="switchRegion('india')" id="nav-india" class="px-8 py-3 bg-slate-800 text-white rounded-full font-bold transition">India</button>
            <button onclick="switchRegion('singapore')" id="nav-singapore" class="px-8 py-3 bg-white text-slate-600 border border-slate-200 rounded-full font-bold transition">Singapore</button>
        </div>
        
        <div id="summary-bar" class="grid grid-cols-3 gap-6 bg-slate-900 p-8 rounded-[32px] text-white shadow-2xl">
            <div class="border-r border-slate-700 text-center">
                <p id="label-sa" class="text-[10px] font-bold text-slate-400 uppercase">Total Sum Assured</p>
                <p id="total-sa" class="text-4xl font-black text-emerald-400">0</p>
            </div>
            <div class="border-r border-slate-700 text-center">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Annual Premium</p>
                <p id="total-premium" class="text-4xl font-black text-indigo-400">0</p>
            </div>
            <div class="text-center">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Current Status</p>
                <p id="status-tag" class="text-4xl font-black text-orange-400">ACTIVE</p>
            </div>
        </div>
    </div>

    <div id="container" class="max-w-7xl mx-auto"></div>

    <script type="module">
        import { POLICY_DATA } from './data.js';
        window.POLICY_DATA = POLICY_DATA;
        
        // Dynamic Global Time
        window.TODAY = new Date();
        window.CURRENT_YEAR = window.TODAY.getFullYear();

        // Global Card Toggle
        window.toggleCard = (id) => {
            const card = document.getElementById(`card-${id}`);
            const wasOpen = card.classList.contains('open');
            document.querySelectorAll('.policy-card').forEach(c => c.classList.remove('open'));
            if (!wasOpen) card.classList.add('open');
        };

        // Shared Formatting Utility
        window.autoFmt = (val, sym) => {
            if (!val) return sym + "0";
            const num = typeof val === 'number' ? val : parseFloat(String(val).replace(/[₹$,\s]/g, ""));
            return isNaN(num) ? val : sym + num.toLocaleString();
        };

        // Navigation Switcher
        window.switchRegion = (region) => {
            const btnInd = document.getElementById('nav-india');
            const btnSg = document.getElementById('nav-singapore');
            
            if(region === 'india') {
                btnInd.className = "px-8 py-3 bg-slate-800 text-white rounded-full font-bold transition";
                btnSg.className = "px-8 py-3 bg-white text-slate-600 border border-slate-200 rounded-full font-bold transition";
                renderIndia();
            } else {
                btnSg.className = "px-8 py-3 bg-[#d31145] text-white rounded-full font-bold transition";
                btnInd.className = "px-8 py-3 bg-white text-slate-600 border border-slate-200 rounded-full font-bold transition";
                renderSingapore();
            }
        };

        // Boot
        setTimeout(() => switchRegion('india'), 100);
    </script>

    <script src="india.js"></script>
    <script src="singapore.js"></script>

</body>
</html>
