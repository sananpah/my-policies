<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="main-title">Nami Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="india_styles.css">
    <style>
        .policy-card .content-area { display: none; }
        .policy-card.open .content-area { display: block; }

        .simple-build {
            position: fixed; top: 15px; right: 20px;
            font-family: monospace; font-size: 11px; font-weight: bold;
            color: #6366f1; background: rgba(99, 102, 241, 0.1);
            padding: 4px 12px; border-radius: 20px;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
            animation: pulse-soft 3s infinite;
            z-index: 1000;
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
        }

        .funky-badge {
            font-family: 'Orbitron', sans-serif; font-size: 9px; font-weight: 900; 
            padding: 8px 14px; border-radius: 12px;
            text-transform: uppercase; background: #0f172a; color: #fff;
            position: relative; overflow: hidden; display: inline-block;
        }
        .funky-badge::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg); animation: sweep 3s infinite linear;
        }
        @keyframes sweep { 0% { left: -100%; } 100% { left: 100%; } }
    </style>
</head>
<body class="bg-slate-50">

    <div id="version-tag" class="simple-build"></div>

    <div class="max-w-7xl mx-auto mb-10 pt-10 px-4">
        <div class="flex justify-between items-end mb-6">
            <h1 class="text-5xl font-black text-slate-900 tracking-tighter">Nami Portfolio</h1>
            <div id="portfolio-status" class="funky-badge">India Portfolio</div>
        </div>
        
        <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
            <div class="flex gap-4">
                <button onclick="render('india')" class="px-8 py-3 bg-slate-800 text-white rounded-full font-bold hover:bg-slate-700 transition shadow-lg">India</button>
                <button onclick="render('singapore')" class="px-8 py-3 bg-slate-800 text-white rounded-full font-bold hover:bg-slate-700 transition shadow-lg">Singapore</button>
            </div>

            <div class="flex items-center gap-3 bg-white p-2 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-[10px] font-black uppercase text-slate-400 ml-2">Sort By</span>
                <select id="sort-trigger" onchange="render(window.currentCategory)" class="bg-transparent text-xs font-bold rounded-lg px-2 py-1 outline-none cursor-pointer">
                    <option value="default">Default Order</option>
                    <option value="premium">Premium: High to Low</option>
                    <option value="time">Maturity: Soonest First</option>
                    <option value="due">Due Date: Earliest First</option>
                </select>
            </div>
        </div>
        
        <div id="summary-bar" class="grid grid-cols-3 gap-6 bg-slate-900 p-8 rounded-[32px] text-white shadow-2xl mb-10">
            <div class="border-r border-slate-700 text-center">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Total Sum Assured</p>
                <p id="total-sa" class="text-4xl font-black text-emerald-400">0</p>
            </div>
            <div class="border-r border-slate-700 text-center">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Annual Premium</p>
                <p id="total-premium" class="text-4xl font-black text-indigo-400">0</p>
            </div>
            <div class="text-center">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Portfolio Value</p>
                <p id="total-unit-value" class="text-4xl font-black text-pink-500">0</p>
            </div>
        </div>
    </div>

    <div id="container" class="max-w-7xl mx-auto pb-20 px-4"></div>

    <script type="module">
        // --- THE ONLY PLACE YOU EVER CHANGE THE VERSION ---
        const APP_VERSION = "4.0.24";

        // Push version to the Document Title and the UI Badge
        document.title = `Nami Portfolio v${APP_VERSION}`;
        document.getElementById('version-tag').innerText = `v${APP_VERSION}`;

        // Dynamic Imports
        const [Data, Tools, IndiaComp, SGComp] = await Promise.all([
            import(`./data.js?v=${APP_VERSION}`),
            import(`./india.js?v=${APP_VERSION}`),
            import(`./component_in.js?v=${APP_VERSION}`),
            import(`./component_sg.js?v=${APP_VERSION}`)
        ]);

        const { POLICY_DATA } = Data;
        const { toNum } = Tools;
        const { createPolicyCard } = IndiaComp;
        const { createSGCard } = SGComp;

        const TODAY = new Date();
        const CURRENT_YEAR = TODAY.getFullYear();
        window.currentCategory = 'india';

        window.toggleCard = (id) => {
            const card = document.getElementById(`card-${id}`);
            const wasOpen = card.classList.contains('open');
            document.querySelectorAll('.policy-card').forEach(c => c.classList.remove('open'));
            if (!wasOpen) card.classList.add('open');
        };

        const parseDate = (str) => {
            if (!str || str === "PAID UP") return new Date(9999, 0, 1);
            const p = str.split(' ');
            return new Date(`${p[1]} ${p[0]}, ${p[2]}`);
        };

        window.render = function(cat) {
            window.currentCategory = cat;
            const sortBy = document.getElementById('sort-trigger').value;
            let list = [...(POLICY_DATA[cat] || [])];
            const sym = (cat === 'singapore') ? "$" : "₹";

            document.getElementById('portfolio-status').innerText = `${cat} Portfolio`;

            if (sortBy === 'premium') list.sort((a, b) => toNum(b.premium) - toNum(a.premium));
            else if (sortBy === 'due') list.sort((a, b) => parseDate(a.dueDate) - parseDate(b.dueDate));
            else if (sortBy === 'time') list.sort((a, b) => parseDate(a.premiumEnds) - parseDate(b.premiumEnds));

            const container = document.getElementById('container');
            container.innerHTML = list.map(p => 
                (cat === 'singapore') 
                    ? createSGCard(p, sym, TODAY, CURRENT_YEAR) 
                    : createPolicyCard(p, sym, TODAY, CURRENT_YEAR)
            ).join('');

            // Calculate Total Sum Assured with fallback logic
            const tSA = list.reduce((acc, p) => {
            const rawSA = toNum(p.sumAssured);
            const accountVal = toNum(p.currentUnitValue || 0);
            // Logic: If Sum Assured is 0, use current account value
            const effectiveSA = (rawSA === 0) ? accountVal : rawSA;
            return acc + effectiveSA;
            }, 0);

            const tAnn = list.reduce((acc, p) => acc + (p.dueDate !== "PAID UP" ? toNum(p.premium) : 0), 0);
            const tUnitValue = list.reduce((acc, p) => acc + toNum(p.currentUnitValue || 0), 0);
            
            document.getElementById('total-sa').innerText = sym + Math.round(tSA).toLocaleString();
            document.getElementById('total-premium').innerText = sym + Math.round(tAnn).toLocaleString();
            document.getElementById('total-unit-value').innerText = sym + Math.round(tUnitValue).toLocaleString();
        }

        render('india');
    </script>
</body>
</html>
