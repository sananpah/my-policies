<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nami Insurance Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .maroon-text { color: #8b1d1d; }
        
        /* Navigation Tabs */
        .nav-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 2rem; }
        .tab-btn { padding: 12px 20px; font-weight: 700; text-transform: uppercase; font-size: 11px; border-radius: 8px; transition: all 0.3s ease; border: 1px solid #e2e8f0; background: white; color: #64748b; cursor: pointer; }
        .tab-btn.active { background: #8b1d1d; color: white; border-color: #8b1d1d; box-shadow: 0 4px 12px rgba(139, 29, 29, 0.2); }
        .tab-btn.active-sg { background: #d31145; color: white; border-color: #d31145; box-shadow: 0 4px 12px rgba(211, 17, 69, 0.2); }
        .tab-btn.active-wife { background: #0d9488; color: white; border-color: #0d9488; box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2); }

        /* Card Styling */
        .policy-card { background: white; border-top: 2px solid; border-left: 4px solid; border-radius: 4px; position: relative; transition: all 0.3s ease; margin-bottom: 1rem; }
        .glow-active { animation: subtleGlow 2s infinite ease-in-out; border-width: 2px !important; }
        @keyframes subtleGlow {
            0%, 100% { box-shadow: 0 0 5px rgba(139, 29, 29, 0.2); }
            50% { box-shadow: 0 0 20px rgba(139, 29, 29, 0.4); }
        }

        /* Timeline & Hover Logic */
        .vertical-divider { width: 2px; height: 18px; background-color: #22c55e; position: absolute; top: -6px; z-index: 30; }
        .timeline-logo { position: absolute; right: 10px; top: -30px; height: 26px; z-index: 40; opacity: 0.8; }
        .payout-dot { width: 6px; height: 6px; background: #f59e0b; border-radius: 50%; position: absolute; top: 50%; transform: translateY(-50%); border: 1px solid white; }
        
        .segment-container, .hover-zone { position: relative; cursor: pointer; z-index: 50; }
        .tooltip-text {
            visibility: hidden; opacity: 0; position: absolute; bottom: 180%; left: 50%;
            transform: translateX(-50%); background: #1f2937; color: white;
            padding: 6px 12px; border-radius: 4px; font-size: 10px; font-weight: 600;
            white-space: nowrap; transition: all 0.2s; z-index: 100; pointer-events: none;
        }
        .segment-container:hover > .tooltip-text, .hover-zone:hover > .tooltip-text { opacity: 1; visibility: visible; transform: translate(-50%, -8px); }

        .content-area { display: none; }
        .open .content-area { display: block; }
        .chevron { transition: transform 0.3s; }
        .open .chevron { transform: rotate(180deg); }
        .bg-logo-large { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); height: 55px; opacity: 0.08; z-index: 1; pointer-events: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto mb-10 text-center">
        <h1 class="text-4xl font-bold maroon-text uppercase tracking-widest" style="font-family: 'Playfair Display', serif;">Portfolio Dashboard</h1>
        <p class="text-xs text-gray-400 font-bold mt-2 uppercase tracking-tighter">Live Valuation & Policy Tracking</p>
    </div>

    <div class="nav-container">
        <button id="btn-india" onclick="setView('Self-India')" class="tab-btn active">My India</button>
        <button id="btn-sg" onclick="setView('Self-Singapore')" class="tab-btn">My Singapore</button>
        <button id="btn-wife" onclick="setView('Wife')" class="tab-btn">Wife's Portfolio</button>
    </div>

    <div id="summary-bar" class="max-w-6xl mx-auto mb-8 grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    <div id="policy-container" class="max-w-6xl mx-auto"></div>

    <script>
        let currentView = 'Self-India';
        const today = new Date(); 
        const logos = {
            indusInd: "image_4e0b3d.png", kotak: "image_5d7f80.png", axis: "image_7a80d9.png", 
            bharti: "image_86c684.png", sbi: "image_cda45c.png", icici: "image_d82175.png", aia: "image_4b9b3f.png"
        };
        const surrenderSchedule = { 1:1, 2:1, 3:0.8, 4:0.7, 5:0.6, 6:0.5, 7:0.45, 8:0.35, 9:0.2, 10:0.05, 11:0 };

        const allPolicies = [
            /* INDIA - SELF */
            { owner: "Self", region: "India", name: "INLI Life Nishchit Ace", id: "54751949", type: "TRADITIONAL", currency: "₹", premium: 209000, sumAssured: "₹ 2,626,948", dueDate: "17 Nov 2026", term: 30, commenced: "17 Nov 2025", premiumEnds: "17 Nov 2034", maturity: "17 Nov 2055", premiumYears: 10, color: "#b91c1c", brand: "indusInd", payouts: [{ range: "11-15 Yr", text: "Income: ₹ 1.33L", width: "20%" }, { range: "16-20 Yr", text: "Income: ₹ 1.60L", width: "20%" }, { range: "21-25 Yr", text: "Income: ₹ 1.87L", width: "20%" }, { range: "25-30 Yr", text: "Income: ₹ 2.14L", width: "25%" }] },
            { owner: "Self", region: "India", name: "INLI Nishchit Pension SL", id: "54679062", type: "TRADITIONAL", currency: "₹", premium: 200000, sumAssured: "₹ 89,830", dueDate: "30 May 2026", term: 52, commenced: "30 May 2025", premiumEnds: "30 May 2030", maturity: "30 May 2077", premiumYears: 6, color: "#b91c1c", brand: "indusInd", payouts: [{ range: "Annuity", text: "Guaranteed Payout", width: "85%" }] },
            { owner: "Self", region: "India", name: "Nishchit Samrudhi Income", id: "54040166", type: "TRADITIONAL", currency: "₹", premium: 200000, sumAssured: "₹ 1,750,854", dueDate: "10 Jan 2027", term: 28, commenced: "10 Jan 2022", premiumEnds: "10 Jan 2028", maturity: "10 Jan 2050", premiumYears: 7, color: "#b91c1c", brand: "indusInd", payouts: [{ range: "8-28 Yr", text: "Income: ₹ 100k", width: "85%" }] },
            { owner: "Self", region: "India", name: "Reliance Money Back", id: "53044042", type: "TRADITIONAL", currency: "₹", premium: 14400, sumAssured: "₹ 1,23,940", dueDate: "08 Sep 2026", term: 15, commenced: "08 Sep 2017", premiumEnds: "08 Sep 2026", maturity: "08 Sep 2032", premiumYears: 10, color: "#b91c1c", brand: "indusInd", payouts: [{ range: "11-14 Yr", text: "Annual: ₹ 18k", width: "40%" }, { range: "15 Yr", text: "Lump Sum: ₹ 49k", width: "45%" }] },
            { owner: "Self", region: "India", name: "Kotak Retirement Savings", id: "79079094", type: "TRADITIONAL", currency: "₹", premium: 50000, sumAssured: "₹ 3,23,695", dueDate: "13 Mar 2026", term: 15, commenced: "13 Mar 2025", premiumEnds: "13 Mar 2031", maturity: "13 Mar 2040", premiumYears: 7, color: "#1e3a8a", brand: "kotak" },
            { owner: "Self", region: "India", name: "Kotak Fortune Maximiser", id: "79425536", type: "TRADITIONAL", currency: "₹", premium: 70000, sumAssured: "₹ 7,11,994", dueDate: "14 Aug 2026", term: 64, commenced: "14 Aug 2025", premiumEnds: "14 Aug 2034", maturity: "14 Aug 2089", premiumYears: 10, color: "#1e3a8a", brand: "kotak" },
            { owner: "Self", region: "India", name: "Axis Fast Track Super", id: "608480927", type: "ULIP", currency: "₹", premium: 50000, sumAssured: "₹ 0", dueDate: "PAID UP", term: 10, commenced: "04 Feb 2022", premiumEnds: "04 Feb 2026", maturity: "04 Feb 2032", premiumYears: 5, color: "#0c4a6e", brand: "axis", isPaidUp: true },
            { owner: "Self", region: "India", name: "Bharti Life Wealth Pro", id: "503-9562771", type: "ULIP", currency: "₹", premium: 50000, sumAssured: "₹ 0", dueDate: "28 Sep 2026", term: 15, commenced: "28 Sep 2023", premiumEnds: "28 Sep 2029", maturity: "28 Sep 2038", premiumYears: 7, color: "#4338ca", brand: "bharti" },

            /* SINGAPORE - SELF */
            { owner: "Self", region: "Singapore", name: "Pro-Achiever 2.0", id: "U126327913", type: "ILP", currency: "$", premium: 5000, currentValuation: 22450, dueDate: "30 Dec 2026", term: 56, commenced: "30 Dec 2021", premiumEnds: "30 Dec 2031", maturity: "30 Dec 2077", premiumYears: 10, color: "#d31145", brand: "aia", isSingapore: true },

            /* WIFE */
            { owner: "Wife", region: "India", name: "SBI Smart Privilege Plus", id: "3N307267702", type: "ULIP", currency: "₹", premium: 600000, sumAssured: "₹ 42L", dueDate: "23 Apr 2026", term: 15, commenced: "23 Apr 2025", premiumEnds: "23 Apr 2029", maturity: "23 Apr 2040", premiumYears: 5, color: "#1e3a8a", brand: "sbi" },
            { owner: "Wife", region: "India", name: "ICICI Signature", id: "K7639543", type: "ULIP", currency: "₹", premium: 500000, sumAssured: "₹ 50L", dueDate: "29 Nov 2026", term: 27, commenced: "29 Nov 2025", premiumEnds: "29 Nov 2031", maturity: "29 Nov 2052", premiumYears: 7, color: "#b91c1c", brand: "icici" }
        ];

        function setView(view) {
            currentView = view;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'active-sg', 'active-wife'));
            if(view === 'Self-India') document.getElementById('btn-india').classList.add('active');
            if(view === 'Self-Singapore') document.getElementById('btn-sg').classList.add('active-sg');
            if(view === 'Wife') document.getElementById('btn-wife').classList.add('active-wife');
            render();
        }

        function render() {
            const container = document.getElementById('policy-container');
            const filtered = allPolicies.filter(p => {
                if(currentView === 'Wife') return p.owner === 'Wife';
                const [owner, region] = currentView.split('-');
                return p.owner === owner && p.region === region;
            });

            let totalPrem = 0, totalVal = 0;
            container.innerHTML = filtered.map(p => {
                const startYear = parseInt(p.commenced.split(' ')[2]);
                const curYear = today.getFullYear();
                const diffDays = Math.ceil((new Date(p.dueDate) - today) / (1000*60*60*24));
                const isNear = diffDays > 0 && diffDays <= 45;
                
                totalPrem += p.premium;
                if(p.currentValuation) totalVal += p.currentValuation;

                // Timeline Construction
                let timeline = `<div class="flex gap-1 relative items-center mb-2">`;
                for(let i=0; i<p.premiumYears; i++) {
                    const yr = startYear + i;
                    const paid = yr < curYear || (yr === curYear && today >= new Date(`${yr} ${p.commenced.split(' ')[1]} ${p.commenced.split(' ')[0]}`));
                    const penalty = p.isSingapore ? ` | Penalty: ${(surrenderSchedule[i+1]*100 || 0)}%` : '';
                    timeline += `<div class="segment-container flex-1 h-1.5 rounded-sm ${paid ? 'bg-green-500' : 'bg-gray-200'}">
                        <span class="tooltip-text">Year ${i+1} (${yr})${penalty}</span>
                        ${i===0 ? '<div class="vertical-divider left-0"></div>' : ''}
                    </div>`;
                }
                
                // Growth/Post-Premium Hover Section
                timeline += `<div class="flex-[6] h-1.5 rounded-sm relative bg-gray-100 border-l-2 border-white">
                    <div class="vertical-divider left-0"></div>`;
                if(p.payouts) {
                    let left = 0;
                    p.payouts.forEach(po => {
                        timeline += `<div class="hover-zone absolute h-full" style="left:${left}%; width:${po.width};">
                            <span class="tooltip-text">${po.range}: ${po.text}</span>
                            <div class="payout-dot" style="left:0"></div>
                        </div>`;
                        left += parseFloat(po.width);
                    });
                } else {
                    timeline += `<div class="hover-zone w-full h-full"><span class="tooltip-text">Growth Phase</span></div>`;
                }
                timeline += `<img src="${logos[p.brand]}" class="timeline-logo"><div class="vertical-divider right-0"></div></div></div>`;

                return `
                <div class="policy-card ${isNear ? 'glow-active' : ''}" style="border-color:${p.color}" id="card-${p.id}">
                    <img src="${logos[p.brand]}" class="bg-logo-large">
                    <div class="p-6 flex justify-between items-center cursor-pointer relative z-20" onclick="document.getElementById('card-${p.id}').classList.toggle('open')">
                        <div class="flex items-center gap-4">
                            <svg class="chevron w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <div>
                                <h2 class="text-base font-bold text-gray-800">${p.name}</h2>
                                <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">${p.id} • ${p.type}</p>
                            </div>
                        </div>
                        <div class="flex gap-6 text-right items-center">
                            <div><p class="text-[8px] text-gray-400 font-bold uppercase">Annual Premium</p><p class="text-md font-bold">${p.currency}${p.premium.toLocaleString()}</p></div>
                            ${p.currentValuation ? `<div><p class="text-[8px] text-gray-400 font-bold uppercase">Valuation</p><p class="text-md font-bold text-green-600">${p.currency}${p.currentValuation.toLocaleString()}</p></div>` : ''}
                        </div>
                    </div>
                    <div class="content-area bg-gray-50/50">
                        <div class="p-6 grid grid-cols-2 md:grid-cols-4 gap-4 text-xs border-y border-gray-100 bg-white">
                            <div><p class="text-[9px] text-gray-400 font-bold uppercase">Commenced</p><p class="font-bold text-gray-700">${p.commenced}</p></div>
                            <div><p class="text-[9px] text-gray-400 font-bold uppercase">Next Due</p><p class="font-bold ${isNear?'text-red-600':''}">${p.dueDate}</p></div>
                            <div><p class="text-[9px] text-gray-400 font-bold uppercase">Prem. Ends</p><p class="font-bold text-gray-700">${p.premiumEnds}</p></div>
                            <div><p class="text-[9px] text-gray-400 font-bold uppercase">Maturity</p><p class="font-bold text-gray-700">${p.maturity}</p></div>
                        </div>
                        <div class="p-6 pb-12 relative px-8">
                            ${timeline}
                            <div class="flex text-[9px] text-gray-400 font-bold uppercase mt-4">
                                <div class="w-1/4">Start: ${p.commenced}</div>
                                <div class="w-1/2 text-center">Premium Ends: ${p.premiumEnds}</div>
                                <div class="w-1/4 text-right">Maturity: ${p.maturity}</div>
                            </div>
                            ${p.isSingapore ? `<div class="mt-6 p-4 bg-white border border-red-100 rounded flex justify-between shadow-sm">
                                <div><p class="text-[10px] text-gray-400 font-bold uppercase">Current Liquidity</p><p class="text-xl font-black text-gray-800">$${(p.currentValuation * (1 - (surrenderSchedule[curYear-startYear+1]||0))).toLocaleString()}</p></div>
                                <div class="text-right"><p class="text-[10px] text-red-500 font-bold uppercase">Penalty: ${((surrenderSchedule[curYear-startYear+1]||0)*100).toFixed(0)}%</p></div>
                            </div>` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');

            const accent = currentView === 'Self-Singapore' ? '#d31145' : (currentView === 'Wife' ? '#0d9488' : '#8b1d1d');
            document.getElementById('summary-bar').innerHTML = `
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm border-l-4" style="border-left-color: ${accent}">
                    <p class="text-[10px] font-bold text-gray-400 uppercase">Total Annual Premium</p>
                    <p class="text-2xl font-black" style="color:${accent}">${filtered[0]?.currency || '₹'}${totalPrem.toLocaleString()}</p>
                </div>
                ${totalVal > 0 ? `<div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm border-l-4 border-l-green-500">
                    <p class="text-[10px] font-bold text-gray-400 uppercase">Portfolio Market Value</p>
                    <p class="text-2xl font-black text-green-600">${filtered[0]?.currency}$${totalVal.toLocaleString()}</p>
                </div>` : ''}`;
        }
        render();
    </script>
</body>
</html>
