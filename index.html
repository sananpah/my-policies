<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Matrix - Executive Dashboard</title>
    
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50">

    <header class="dashboard-header">
        <div class="build-info">RESTORED BUILD: v6.5.1.STABLE</div>
        <h1 class="brand-header">INSURANCE MATRIX</h1>
        <p class="text-[10px] font-black text-slate-400 tracking-[0.3em] uppercase mt-2">Active Portfolio & Maturity Tracker</p>
    </header>

    <main class="container mx-auto px-4 pb-24">
        
        <div class="flex items-center justify-between mb-6 mt-10">
            <h2 class="region-title text-slate-800">INDIA PORTFOLIO</h2>
            <div class="flex items-center gap-2">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest font-black">Live Sync Active</span>
            </div>
        </div>
        <div id="india-grid" class="flex flex-col gap-4 mb-20">
            <div class="py-10 text-center text-slate-300 font-black uppercase text-xs animate-pulse">Syncing India Node...</div>
        </div>

        <div class="flex items-center justify-between mb-6">
            <h2 class="region-title text-slate-800" style="border-left-color: #ec4899;">SINGAPORE PORTFOLIO</h2>
        </div>
        <div id="singapore-grid" class="flex flex-col gap-4 mb-20">
            <div class="py-10 text-center text-slate-300 font-black uppercase text-xs animate-pulse">Syncing Singapore Node...</div>
        </div>

        <div class="flex items-center justify-between mb-6">
            <h2 class="region-title text-slate-800" style="border-left-color: #f59e0b;">HEALTH PORTFOLIO</h2>
        </div>
        <div id="health-grid" class="flex flex-col gap-4">
            <div class="py-10 text-center text-slate-300 font-black uppercase text-xs animate-pulse">Syncing Health Node...</div>
        </div>

    </main>

    <script type="module">
        import { syncWithGoogleSheets } from './loader.js';
        import { POLICY_DATA } from './data.js';
        import { createPolicyCard } from './component_in.js';

        async function init() {
            try {
                console.log("🚀 Initializing Matrix Engine...");
                
                // 1. Fetch live data from Google Sheets
                const liveData = await syncWithGoogleSheets(POLICY_DATA);
                console.log("📊 Data Sync Complete:", liveData);

                const TODAY = new Date();
                const CURRENT_YEAR = TODAY.getFullYear();

                // 2. RENDER HELPER FUNCTION
                const renderRegion = (regionKey, gridId, currency) => {
                    const container = document.getElementById(gridId);
                    if (!container) return;
                    
                    // Clear the individual loaders
                    container.innerHTML = "";

                    if (liveData && liveData[regionKey] && liveData[regionKey].length > 0) {
                        liveData[regionKey].forEach(p => {
                            container.innerHTML += createPolicyCard(p, currency, TODAY, CURRENT_YEAR);
                        });
                    } else {
                        // Fallback if region is empty
                        container.innerHTML = `
                            <div class="p-12 text-center text-slate-300 font-black uppercase text-[10px] border-2 border-dashed border-slate-200 rounded-[40px]">
                                No Active Policies in ${regionKey} Portfolio
                            </div>`;
                    }
                };

                // 3. EXECUTE RENDERS FOR ALL REGIONS
                renderRegion('india', 'india-grid', '₹');
                renderRegion('singapore', 'singapore-grid', 'S$');
                renderRegion('health', 'health-grid', '₹');

                console.log("✅ Matrix Rendering Finished.");
            } catch (err) {
                console.error("❌ Critical System Error:", err);
                // Global Error Message
                document.body.innerHTML += `
                    <div class="fixed bottom-10 left-10 right-10 p-6 bg-red-600 text-white rounded-2xl shadow-2xl font-black text-center z-[9999]">
                        SYSTEM ERROR: ${err.message}. Check Loader.js or Data.js.
                    </div>`;
            }
        }

        // Initialize on Load
        init();
    </script>
</body>
</html>
