<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Matrix Dashboard</title>
    
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50">

    <header class="dashboard-header">
        <div class="build-info">STABLE BUILD: v6.2.6.FINAL</div>
        <h1 class="brand-header">INSURANCE MATRIX</h1>
        <p class="text-[10px] font-black text-slate-400 tracking-[0.3em] uppercase mt-2">Active Portfolio & Maturity Tracker</p>
    </header>

    <main class="container mx-auto px-4 pb-20">
        
        <div class="flex items-center justify-between mb-6 mt-10">
            <h2 class="region-title text-slate-800">INDIA PORTFOLIO</h2>
            <div class="flex items-center gap-2">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest">Live Sync Active</span>
            </div>
        </div>
        <div id="india-grid" class="flex flex-col gap-4 mb-16">
            <div class="py-10 text-center text-slate-400 text-xs font-bold uppercase">Syncing India...</div>
        </div>

        <div class="flex items-center justify-between mb-6">
            <h2 class="region-title text-slate-800" style="border-left-color: #ec4899;">SINGAPORE PORTFOLIO</h2>
        </div>
        <div id="singapore-grid" class="flex flex-col gap-4 mb-16">
            <div class="py-10 text-center text-slate-400 text-xs font-bold uppercase">Syncing Singapore...</div>
        </div>

        <div class="flex items-center justify-between mb-6">
            <h2 class="region-title text-slate-800" style="border-left-color: #f59e0b;">HEALTH PORTFOLIO</h2>
        </div>
        <div id="health-grid" class="flex flex-col gap-4">
            <div class="py-10 text-center text-slate-400 text-xs font-bold uppercase">Syncing Health...</div>
        </div>

    </main>

    <script type="module">
        import { syncWithGoogleSheets } from './loader.js';
        import { POLICY_DATA } from './data.js';
        import { createPolicyCard } from './component_in.js';

        async function init() {
            try {
                console.log("🚀 Initializing Matrix...");
                
                // 1. Fetch live data
                const liveData = await syncWithGoogleSheets(POLICY_DATA);
                console.log("📊 Data Sync Complete:", liveData);

                const TODAY = new Date();
                const CURRENT_YEAR = TODAY.getFullYear();

                // 2. RENDER HELPER
                const renderRegion = (regionKey, gridId, currency) => {
                    const container = document.getElementById(gridId);
                    if (!container) return;
                    
                    // Clear the individual loader
                    container.innerHTML = "";

                    if (liveData && liveData[regionKey] && liveData[regionKey].length > 0) {
                        liveData[regionKey].forEach(p => {
                            container.innerHTML += createPolicyCard(p, currency, TODAY, CURRENT_YEAR);
                        });
                    } else {
                        container.innerHTML = `<div class="p-8 text-center text-slate-300 font-bold uppercase text-[10px] border-2 border-dashed border-slate-100 rounded-[30px]">No Data in ${regionKey}</div>`;
                    }
                };

                // 3. EXECUTE RENDERS
                renderRegion('india', 'india-grid', '₹');
                renderRegion('singapore', 'singapore-grid', 'S$');
                renderRegion('health', 'health-grid', '₹');

                console.log("✅ Rendering Finished.");
            } catch (err) {
                console.error("❌ System Error:", err);
            }
        }

        init();
    </script>
</body>
</html>
