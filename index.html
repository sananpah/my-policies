<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nami Portfolio v3.4.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@800&family=JetBrains+Mono:wght@500&display=swap');
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; color: #1e293b; padding: 40px; }
        
        .version-stamp { position: fixed; top: 15px; right: 20px; font-size: 11px; font-weight: 900; color: #1e293b; background: #fff; padding: 6px 12px; border-radius: 8px; border: 1px solid #cbd5e1; z-index: 9999; }
        .brand-header { font-family: 'Orbitron', sans-serif; background: linear-gradient(90deg, #4f46e5, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Color Logic */
        .bg-passed { background: #14532d; } 
        .bg-current { background: #22c55e; box-shadow: 0 0 10px rgba(34,229,94,0.5); }
        .bg-parrot { background: #a3e635; }
        .bg-wait-past { background: #78350f; } 
        .bg-wait-future { background: #f59e0b; }

        .segment { height: 100%; position: relative; cursor: pointer; transition: 0.2s; border-radius: 4px; margin: 0 1px; }
        .segment:hover { filter: brightness(1.2); transform: scaleY(1.3); z-index: 40; }

        .tooltip { 
            visibility: hidden; opacity: 0; position: absolute; bottom: 180%; left: 50%; transform: translateX(-50%) translateY(10px); 
            background: #0f172a; color: #fff; padding: 12px; border-radius: 8px; font-size: 11px; width: 200px; text-align: center; z-index: 3000; transition: 0.3s;
        }
        .segment:hover .tooltip { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Card Layout */
        .policy-card { background: white; border-radius: 28px; border-left: 14px solid; margin-bottom: 25px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); overflow: hidden; }
        .card-header { cursor: pointer; display: flex; align-items: center; padding: 30px 40px; gap: 20px; }
        
        .content-area { display: none; padding: 50px 60px; border-top: 1px solid #f1f5f9; background: #fafbfc; }
        .open .content-area { display: block; }

        .type-badge { font-size: 10px; font-weight: 900; text-transform: uppercase; padding: 5px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid; }
        .savings { background: #eff6ff; color: #1e40af; border-color: #dbeafe; }
        .retirement { background: #fff7ed; color: #9a3412; border-color: #ffedd5; }
        .ulip { background: #f5f3ff; color: #5b21b6; border-color: #ede9fe; }

        .data-stack { font-family: 'JetBrains+Mono', monospace; font-size: 10px; color: #64748b; margin-top: 4px; }
        .timeline-track { position: relative; height: 36px; background: #e2e8f0; border-radius: 20px; width: 100%; display: flex; align-items: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="version-stamp">BUILD: v3.4.1 | 08-MAR-2026</div>

    <div class="max-w-7xl mx-auto flex justify-between items-end mb-12">
        <div>
            <h1 class="brand-header text-5xl font-black italic tracking-tighter">NAMI PORTFOLIO</h1>
            <p class="text-slate-400 font-bold text-[10px] mt-2 uppercase tracking-[0.4em]">Asset Strategy & Control</p>
        </div>
        <div class="flex gap-4">
            <button onclick="render('india')" id="btn-india" class="px-10 py-3 rounded-2xl font-black border-2 transition-all">INDIA</button>
            <button onclick="render('wife')" id="btn-wife" class="px-10 py-3 rounded-2xl font-black border-2 transition-all">WIFE</button>
            <button onclick="render('singapore')" id="btn-singapore" class="px-10 py-3 rounded-2xl font-black border-2 transition-all">SINGAPORE</button>
        </div>
    </div>

    <div id="container" class="max-w-7xl mx-auto"></div>

    <script type="module">
        import { POLICY_DATA } from './data.js';
        const TODAY = new Date('2026-03-08'); 
        const CURRENT_YEAR = 2026;

        window.toggleCard = (id) => document.getElementById(`card-${id}`).classList.toggle('open');

        window.render = function(cat) {
            const list = POLICY_DATA[cat];
            const sym = cat === 'singapore' ? '$' : '₹';
            
            document.querySelectorAll('button').forEach(b => b.className = "px-10 py-3 rounded-2xl font-black border-2 bg-white text-slate-400 border-slate-200");
            document.getElementById(`btn-${cat}`).className = "px-10 py-3 rounded-2xl font-black border-2 bg-slate-900 text-white border-slate-900 shadow-lg";

            document.getElementById('container').innerHTML = list.map(p => {
                const startY = parseInt(p.commenced.split(' ')[2]);
                const matY = parseInt(p.maturity.split(' ')[2]);
                const premEndYear = parseInt(p.premiumEnds.split(' ')[2]);
                const isPaid = (TODAY > new Date(p.premiumEnds)) || p.dueDate === "PAID UP";

                let timeline = '';
                for(let yr = startY; yr < matY; yr++) {
                    const polYear = yr - startY + 1;
                    const isPast = yr < CURRENT_YEAR;
                    let color = "bg-slate-200";
                    let phase = "";

                    if (yr <= premEndYear && !isPaid) {
                        if (isPast) { color = "bg-passed"; phase = "Premium Paid"; }
                        else if (yr === CURRENT_YEAR) { color = "bg-current"; phase = "Current Installment"; }
                        else { color = "bg-parrot"; phase = "Future Premium"; }
                    } else {
                        color = isPast ? "bg-wait-past" : "bg-wait-future";
                        phase = isPast ? "History" : "Wealth Accrual";
                    }

                    timeline += `<div class="segment ${color}" style="flex:1"><div class="tooltip"><b>${phase}</b><br>Year ${polYear} (${yr})</div></div>`;
                }

                let icon = p.type.toLowerCase().includes('retirement') ? "⛱️" : (p.type.toLowerCase().includes('ulip') ? "📈" : "🛡️");

                return `
                <div class="policy-card" id="card-${p.id}" style="border-color: ${p.color}">
                    <div class="card-header" onclick="toggleCard('${p.id}')">
                        <div style="flex:1.5" class="flex items-center gap-6">
                            <div class="w-24 h-14 flex items-center justify-center bg-slate-50 rounded-xl p-2">
                                <img src="${p.logo}" class="max-h-full max-w-full object-contain">
                            </div>
                            <div>
                                <div class="type-badge ${p.type.toLowerCase()} mb-1">${icon} ${p.type}</div>
                                <h3 class="font-black text-slate-900 text-lg leading-none">${p.name}</h3>
                                <div class="data-stack">UIN: ${p.uin || '101N134V'} | CID: ${p.clientId || 'NAMI-PRO'}</div>
                            </div>
                        </div>

                        <div style="flex:1" class="text-right">
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Premium</p>
                            <p class="text-xl font-black text-emerald-600">${sym}${p.premium.toLocaleString()}</p>
                            <p class="text-[9px] font-bold text-slate-400 uppercase mt-1">Policy: ${p.id}</p>
                        </div>

                        <div style="flex:1" class="text-right">
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Sum Assured</p>
                            <p class="text-xl font-black text-indigo-600">${sym}${p.sumAssured.toLocaleString()}</p>
                            <p class="text-[9px] font-bold text-slate-400 uppercase mt-1">End: ${matY}</p>
                        </div>

                        <div style="flex:1.2" class="flex justify-end">
                            ${isPaid ? `<img src="paid.jpg" class="h-20 rotate-[-12deg] drop-shadow-md">` : `
                                <div class="text-right">
                                    <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Next Due</p>
                                    <div class="bg-white px-4 py-2 rounded-xl border-2 border-slate-200 font-black text-slate-900">${p.dueDate}</div>
                                </div>`}
                        </div>
                    </div>
                    <div class="content-area">
                        <div class="flex justify-between text-[10px] font-black text-slate-400 uppercase mb-2">
                            <span>Started ${startY}</span>
                            <span>Maturity ${matY} (${p.maturityAmt})</span>
                        </div>
                        <div class="timeline-track">
                            <div class="flex h-full w-full mx-1">${timeline}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }
        render('india');
    </script>
</body>
</html>
