<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nami Insurance Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap');
        
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; }
        
        .maroon-text { color: #8b1d1d; }
        
        /* Requirement 2: Full border with thin lines on right/bottom */
        .policy-card { 
            background: white;
            border-top: 2px solid; 
            border-left: 4px solid;
            border-right: 1px solid;
            border-bottom: 1px solid;
            border-radius: 4px;
        }

        .funky-title {
            font-family: 'Playfair Display', serif;
            letter-spacing: -0.01em;
        }

        /* Requirement 4: Vertical green dividers */
        .vertical-divider {
            width: 2px;
            height: 18px;
            background-color: #22c55e;
            position: absolute;
            top: -6px;
        }
        .start-line { left: 0; }
        .end-line { right: -2px; }

        .segment:hover::after {
            content: attr(data-fy);
            position: absolute;
            bottom: 150%;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
        }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto mb-10 text-center">
        <h1 class="text-4xl font-bold maroon-text funky-title uppercase tracking-wider">Nami Insurance Portfolio</h1>
        <div class="h-1 w-24 bg-red-800 mx-auto mt-2 rounded-full"></div>
    </div>

    <div id="policy-container" class="max-w-6xl mx-auto space-y-12"></div>

    <script>
        const myPolicies = [
            {
                name: "Reliance Guaranteed Money Back",
                id: "53044042",
                type: "TRADITIONAL",
                sumAssured: "₹ 1,23,940.00",
                premium: "₹ 14,400.00",
                frequency: "Yearly",
                clientId: "62996974",
                uin: "121N084V03",
                dueDate: "08 Sep 2026",
                lastPaid: "08 Sep 2025",
                term: 15,
                commenced: "08 Sep 2017",
                premiumEnds: "08 Sep 2026",
                maturity: "08 Sep 2032",
                lastPaidYear: 2025,
                premiumYears: 10,
                color: "#b91c1c"
            },
            {
                name: "HSBC Life Strategic Growth",
                id: "88273341",
                type: "UNIT LINKED",
                sumAssured: "₹ 5,00,000.00",
                premium: "₹ 50,000.00",
                frequency: "Yearly",
                clientId: "77221144",
                uin: "112L099V01",
                dueDate: "15 Mar 2026",
                lastPaid: "15 Mar 2024",
                term: 10,
                commenced: "15 Mar 2020",
                premiumEnds: "15 Mar 2025",
                maturity: "15 Mar 2030",
                lastPaidYear: 2024,
                premiumYears: 6,
                color: "#4c1d95"
            }
        ];

        function render() {
            const container = document.getElementById('policy-container');
            container.innerHTML = myPolicies.map(p => {
                const startYear = parseInt(p.commenced.split(' ')[2]);
                let timelineHtml = `<div class="flex gap-1.5 w-full relative">`;
                
                for (let i = 0; i < p.term; i++) {
                    const currentYear = startYear + i;
                    const isPaid = currentYear <= p.lastPaidYear;
                    const isLastPremiumYear = (i + 1) === p.premiumYears;
                    const isFinalYear = (i + 1) === p.term;
                    
                    timelineHtml += `
                        <div class="segment flex-1 h-1.5 rounded-sm relative ${isPaid ? 'bg-green-500' : 'bg-gray-200'}" 
                             data-fy="Y${i+1} - ${currentYear}">
                            ${i === 0 ? '<div class="vertical-divider start-line"></div>' : ''}
                            ${isLastPremiumYear ? '<div class="vertical-divider end-line"></div>' : ''}
                            ${isFinalYear ? '<div class="vertical-divider end-line"></div>' : ''}
                        </div>`;
                }
                timelineHtml += `</div>`;

                return `
                <div class="policy-card shadow-lg" style="border-color: ${p.color}; border-top-width: 2px; border-left-width: 4px; border-right-width: 1px; border-bottom-width: 1px;">
                    <div class="p-6 flex justify-between items-start">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800 funky-title mb-1">${p.name}</h2>
                            <p class="text-sm text-gray-400 font-medium">${p.id} • ${p.type}</p>
                        </div>
                        <div class="flex gap-8 text-right items-center">
                            <div class="border-l border-gray-100 pl-6">
                                <p class="text-[10px] text-gray-400 uppercase font-bold mb-1">Sum Assured:</p>
                                <p class="text-xl font-bold maroon-text">${p.sumAssured}</p>
                            </div>
                            <div class="border-l border-gray-100 pl-6">
                                <p class="text-[10px] text-gray-400 uppercase font-bold mb-1">Instalment Premium:</p>
                                <p class="text-xl font-bold maroon-text">${p.premium}</p>
                            </div>
                            <div class="border-l border-gray-100 pl-6">
                                <p class="text-[10px] text-gray-400 uppercase font-bold mb-1">Premium Frequency</p>
                                <p class="text-xl font-bold maroon-text">${p.frequency}</p>
                            </div>
                        </div>
                    </div>

                    <div class="px-6">
                        <div class="h-[1px] w-full bg-gray-100"></div>
                    </div>

                    <div class="px-6 py-6 grid grid-cols-2 md:grid-cols-6 gap-6 text-[13px]">
                        <div>
                            <p class="text-gray-400 mb-1">Client ID :</p>
                            <p class="font-bold text-gray-800 text-base">${p.clientId}</p>
                            <p class="text-gray-400 mt-2 italic text-[11px]">Last Premium Paid:</p>
                            <p class="font-bold text-gray-700">${p.lastPaid}</p>
                        </div>
                        <div><p class="text-gray-400 mb-1">UIN Number:</p><p class="font-bold text-gray-800 text-base">${p.uin}</p></div>
                        <div><p class="text-gray-400 mb-1">Premium Due Date :</p><p class="font-bold text-gray-800 text-base">${p.dueDate}</p></div>
                        <div><p class="text-gray-400 mb-1">Policy Term :</p><p class="font-bold text-gray-800 text-base">${p.term} Years</p></div>
                        <div><p class="text-gray-400 mb-1">Premium Ends :</p><p class="font-bold text-gray-800 text-base">${p.premiumEnds}</p></div>
                        <div><p class="text-gray-400 mb-1">Maturity Date :</p><p class="font-bold text-gray-800 text-base">${p.maturity}</p></div>
                    </div>

                    <div class="p-6 pb-12 bg-gray-50/50">
                        <p class="text-[10px] text-gray-400 mb-6 font-bold tracking-widest uppercase">Policy Timeline • ${p.frequency}</p>
                        ${timelineHtml}
                        <div class="flex justify-between mt-4 text-[10px] text-gray-400 font-bold uppercase tracking-tight">
                            <div>Policy Commences<br><span class="text-gray-500">${p.commenced}</span></div>
                            <div class="text-center">Premium Payment Ends<br><span class="text-gray-500">${p.premiumEnds}</span></div>
                            <div class="text-right">Policy Maturity<br><span class="text-gray-500">${p.maturity}</span></div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
        render();
    </script>
</body>
</html>
