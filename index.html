<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nami Portfolio v3.4.15</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@800;900&display=swap');
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; color: #1e293b; padding: 40px; }
        
        /* Header Fix */
        .brand-header { 
            font-family: 'Orbitron', sans-serif; 
            background: linear-gradient(90deg, #6366f1, #ec4899, #f59e0b); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 10px rgba(99, 102, 241, 0.2);
            line-height: 1.2;
            display: block;
            width: 100%;
        }

        /* 4-Color Timeline Logic */
        .bg-prem-past { background: #14532d; } 
        .bg-prem-future { background: #a3e635; } 
        .bg-wait-past { background: #78350f; } 
        .bg-wait-future { background: #f59e0b; box-shadow: 0 0 10px rgba(245,158,11,0.3); }
        .bg-current { background: #22c55e; box-shadow: 0 0 15px rgba(34,229,94,0.8); border: 2px solid white; z-index: 10; }
        
        /* Big Glow Paid Up Stamp */
        .paid-stamp {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #22c55e;
            border: 4px solid #22c55e;
            padding: 10px 20px;
            border-radius: 8px;
            text-transform: uppercase;
            transform: rotate(-15deg);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
            background: rgba(34, 197, 94, 0.05);
            display: inline-block;
        }

        .funky-badge { font-family: 'Orbitron', sans-serif; font-size: 9px; font-weight: 900; padding: 4px 12px; border-radius: 8px; text-transform: uppercase; border: 2px solid; display: inline-block; margin-bottom: 8px; }
        .savings { color: #2563eb; border-color: #2563eb; background: #eff6ff; }
        .retirement { color: #ea580c; border-color: #ea580c; background: #fff7ed; }
        .ulip { color: #9333ea; border-color: #9333ea; background: #f5f3ff; }

        .segment { height: 100%; position: relative; cursor: pointer; transition: 0.2s; border-radius: 4px; margin: 0 1px; }
        .segment:hover { filter: brightness(1.2); transform: scaleY(1.4); z-index: 40; }
        .tooltip { visibility: hidden; opacity: 0; position: absolute; bottom: 180%; left: 50%; transform: translateX(-50%) translateY(10px); background: #0f172a; color: #fff; padding: 14px; border-radius: 12px; font-size: 11px; width: 240px; text-align: center; z-index: 3000; transition: 0.3s; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); pointer-events: none; }
        .segment:hover .tooltip { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }

        .policy-card { background: white; border-radius: 32px; border-left: 20px solid; margin-bottom: 30px; box-shadow: 0 15px 25px -5px rgba(0,0,0,0.08); overflow: hidden; }
        .card-header { cursor: pointer; display: flex; align-items: center; padding: 35px 45px; gap: 30px; }
        .content-area { display: none; padding: 40px 60px; border-top: 1px solid #f1f5f9; background: #fafbfc; }
        .open .content-area { display: block; }
        
        .id-pill { background: #fff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 12px; }
        .due-pill { background: #0f172a; color: white; padding: 10px 20px; border-radius: 12px; border: 2px solid #334155; text-align: center; }
        .due-urgent { border-color: #ef4444; color: #f87171; animation: blinker 1s infinite; }
        @keyframes blinker { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .timeline-track { position: relative; height: 44px; background: #e2e8f0; border-radius: 22px; width: 100%; display: flex; align-items: center; margin-top: 25px; padding: 0 4px; }
        .mat-orb { position: absolute; right: -8px; width: 24px; height: 24px; background: #6366f1; border: 4px solid #fff; border-radius: 50%; z-index: 50; }
        .mat-orb .tooltip { left: auto; right: 0; transform: translateX(0); width: 280px; }
        .mat-orb:hover .tooltip { visibility: visible; opacity: 1; }
    </style>
</head>
<body>
    <div class="max-w-7xl mx-auto mb-10">
        <h1 class="brand-header text-5xl md:text-6xl font-black uppercase italic tracking-tighter">Nami Insurance Portfolio</h1>
        <div class="flex gap-2 mt-6">
            <button onclick="render('india')" id="btn-india" class="px-6 py-2 rounded-xl font-bold">INDIA</button>
            <button onclick="render('wife')" id="btn-wife" class="px-6 py-2 rounded-xl font-bold">WIFE</button>
            <button onclick="render('singapore')" id="btn-singapore" class="px-6 py-2 rounded-xl font-bold">SINGAPORE</button>
        </div>
    </div>

    <div id="summary" class="max-w-7xl mx-auto grid grid-cols-2 gap-6 mb-10"></div>
    <div id="container" class="max-w-7xl mx-auto"></div>

    <script type="module">
        import { POLICY_DATA } from './data.js';
        const TODAY = new Date('2026-03-08'); 
        const CURRENT_YEAR = 2026;

        window.toggleCard = (id) => document.getElementById(`card-${id}`).classList.toggle('open');

        window.render = function(cat) {
            const list = POLICY_DATA[cat]; const sym = cat === 'singapore' ? '$' : '₹';
            document.querySelectorAll('button').forEach(b => b.className = "px-6 py-2 rounded-xl font-bold text-slate-400 bg-white border border-slate-200");
            document.getElementById(`btn-${cat}`).className = "px-6 py-2 rounded-xl font-bold bg-slate-900 text-white shadow-lg";

            document.getElementById('summary').innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-indigo-600"><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Active Premium Pool</p><p class="text-3xl font-black">${sym}${list.reduce((s,p)=>s+p.premium,0).toLocaleString()}</p></div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-pink-600"><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Portfolio Cover</p><p class="text-3xl font-black">${sym}${list.reduce((s,p)=>s+p.sumAssured,0).toLocaleString()}</p></div>`;

            document.getElementById('container').innerHTML = list.map(p => {
                const startY = parseInt(p.commenced.split(' ')[2]); const matY = parseInt(p.maturity.split(' ')[2]);
                const premEndYear = parseInt(p.premiumEnds.split(' ')[2]);
                
                // Specific Overrides for Paid Status
                let forcePaid = (p.dueDate === "PAID UP");
                if (p.name.includes("Fast Track Super") && CURRENT_YEAR >= 2026) forcePaid = true; 
                
                const isPaid = (TODAY > new Date(p.premiumEnds)) || forcePaid;
                
                const isULIP = p.name.includes("Bajaj") || p.name.includes("Wealth Pro") || p.name.includes("Fast Track");
                const isNishchitAce = p.name.includes("Nishchit Ace");
                const isSamrudhi = p.name.includes("Samrudhi");

                let isUrgent = false;
                if (!isPaid && p.dueDate !== "PAID UP") {
                    const [d, m, y] = p.dueDate.split(' ');
                    const mIdx = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
                    const diffDays = Math.ceil((new Date(y, mIdx[m], d) - TODAY) / 86400000);
                    if (diffDays <= 30 && diffDays >= -5) isUrgent = true;
                }

                let timeline = '';
                for(let yr = startY; yr < matY; yr++) {
                    const polY = yr - startY + 1; const isPast = yr < CURRENT_YEAR;
                    let color = "", phase = "", detail = "";

                    // PREMIUM PHASE (Including Fast Track logic)
                    const effectivelyPaid = isPaid || (p.name.includes("Fast Track Super") && yr <= 2026);

                    if (yr <= premEndYear && !effectivelyPaid) {
                        if (yr === CURRENT_YEAR) color = "bg-current";
                        else color = isPast ? "bg-prem-past" : "bg-prem-future";
                        phase = "Premium Payment";
                        detail = `Premium: ${sym}${p.premium.toLocaleString()}`;
                    } 
                    // GROWTH / INCOME PHASE
                    else {
                        color = isPast ? "bg-wait-past" : "bg-wait-future";
                        if (isULIP) {
                            phase = "Market Growth Phase";
                            detail = "Units accumulating value (No Income)";
                        } else {
                            phase = "Income Phase";
                            let amt = "₹1,00,000";
                            if (isNishchitAce) {
                                if (polY <= 15) amt = "₹1,33,974"; else if (polY <= 20) amt = "₹1,60,769";
                                else if (polY <= 25) amt = "₹187,564"; else amt = "₹214,359";
                            } else if (isSamrudhi) amt = "₹1,00,000";
                            else amt = (p.name.includes("Pension")) ? "₹89,830" : "₹22,050";
                            detail = `Annual Payout: ${amt}`;
                        }
                    }
                    timeline += `<div class="segment ${color}" style="flex:1"><div class="tooltip"><b>${phase}</b><br><span class="text-orange-400">${detail}</span><br><span class="text-slate-500">Year ${polY} (${yr})</span></div></div>`;
                }

                return `
                <div class="policy-card" id="card-${p.id}" style="border-color: ${p.color}">
                    <div class="card-header" onclick="toggleCard('${p.id}')">
                        <div class="w-[140px] flex-shrink-0"><img src="${p.logo}" class="max-h-[60px]"></div>
                        <div style="flex:1.5"><div class="funky-badge ${p.type.toLowerCase()}">${p.type}</div><h3 class="font-black text-slate-900 text-xl leading-none">${p.name}</h3></div>
                        <div style="flex:1" class="text-right"><p class="text-[10px] font-bold text-slate-400 uppercase">Sum Assured</p><p class="text-xl font-black text-indigo-600">${sym}${p.sumAssured.toLocaleString()}</p></div>
                        <div style="flex:1" class="text-right"><p class="text-[10px] font-bold text-slate-400 uppercase">Premium</p><p class="text-xl font-black text-emerald-600">${sym}${p.premium.toLocaleString()}</p></div>
                        <div style="flex:1.2" class="flex justify-end">${isPaid ? `<div class="paid-stamp">PAID UP</div>` : `<div class="text-right"><p class="text-[10px] font-black text-slate-400 uppercase mb-1">Next Due Date</p><div class="due-pill font-black text-sm ${isUrgent ? 'due-urgent' : ''}">${p.dueDate}</div></div>`}</div>
                    </div>
                    <div class="content-area">
                        <div class="grid grid-cols-3 gap-4 mb-8">
                            <div class="id-pill"><p class="text-[9px] font-bold text-slate-400 uppercase">Policy Number</p><p class="font-black text-sm text-slate-700">${p.id}</p></div>
                            <div class="id-pill"><p class="text-[9px] font-bold text-slate-400 uppercase">Customer ID</p><p class="font-black text-sm text-slate-700">${p.clientId || 'NAMI-IND-77'}</p></div>
                            <div class="id-pill"><p class="text-[9px] font-bold text-slate-400 uppercase">UIN Number</p><p class="font-black text-sm text-slate-700">${p.uin || '101N134V02'}</p></div>
                        </div>
                        <div class="timeline-track"><div class="flex h-full w-full mx-1">${timeline}</div><div class="mat-orb"><div class="tooltip"><b>Maturity Value</b><br><span class="text-pink-400 text-2xl font-black">${p.maturityAmt}</span></div></div></div>
                    </div>
                </div>`;
            }).join('');
        }
        render('india');
    </script>
</body>
</html>
