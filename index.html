<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nami Portfolio v3.5.11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Inter:wght@400;700;900&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; padding: 40px; }
        .brand-header { font-family: 'Orbitron', sans-serif; background: linear-gradient(90deg, #6366f1, #ec4899, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 3.5rem; font-weight: 900; text-transform: uppercase; line-height: 1.1; }
        .build-tag { position: absolute; top: 40px; right: 40px; font-family: 'Orbitron', sans-serif; background: #e2e8f0; padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 800; color: #64748b; }

        @keyframes alert-blink {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); background-color: #ef4444; }
            100% { opacity: 1; transform: scale(1); }
        }
        .due-blink { animation: alert-blink 1.5s infinite ease-in-out; border: 2px solid white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        /* Timeline States */
        .bg-prem-past { background: #14532d; } .bg-prem-future { background: #a3e635; } 
        .bg-wait-past { background: #78350f; } .bg-wait-future { background: #f59e0b; }
        .bg-current { background: #22c55e; box-shadow: 0 0 15px rgba(34,229,94,0.6); border: 2px solid white; z-index: 10; }
        .bg-mixed-past { background: repeating-linear-gradient(45deg, #14532d, #14532d 10px, #78350f 10px, #78350f 20px); }
        .bg-mixed-future { background: repeating-linear-gradient(45deg, #a3e635, #a3e635 10px, #f59e0b 10px, #f59e0b 20px); }
        
        .paid-stamp { font-family: 'Orbitron', sans-serif; color: #22c55e; border: 4px solid #22c55e; padding: 6px 12px; border-radius: 8px; transform: rotate(-12deg); font-weight: 900; background: white; font-size: 14px; }
        .policy-card { background: white; border-radius: 32px; border-left: 20px solid; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); overflow: visible; }
        .card-header { cursor: pointer; display: flex; align-items: center; padding: 25px 40px; gap: 20px; }
        .content-area { display: none; padding: 40px; border-top: 1px solid #f1f5f9; background: #fafbfc; border-radius: 0 0 32px 0; }
        .open .content-area { display: block; }

        .timeline-track { position: relative; height: 40px; background: #e2e8f0; border-radius: 20px; width: 100%; display: flex; padding: 0 4px; align-items: center; margin-top: 20px; }
        .segment { height: 32px; flex: 1; margin: 0 1px; border-radius: 4px; position: relative; transition: 0.2s; }
        .segment:hover { transform: scaleY(1.3); z-index: 50; }
        
        .tooltip { visibility: hidden; opacity: 0; position: absolute; bottom: 150%; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 10px; border-radius: 8px; width: 220px; text-align: center; z-index: 100; font-size: 11px; pointer-events: none; transition: 0.2s opacity; }
        .segment:hover .tooltip { visibility: visible; opacity: 1; }
        
        .mat-node { position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; background: #0f172a; border-radius: 50%; border: 3px solid white; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .mat-node:hover .tooltip { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <div class="build-tag">BUILD v3.5.11</div>

    <div class="max-w-7xl mx-auto mb-10">
        <h1 class="brand-header">Nami Portfolio</h1>
        
        <div id="summary-bar" class="grid grid-cols-3 gap-6 mt-8 bg-slate-900 p-8 rounded-[32px] text-white shadow-2xl">
            <div class="border-r border-slate-700 text-center">
                <p class="text-[10px] uppercase font-black text-slate-400 mb-1 tracking-widest">Total Sum Assured</p>
                <p id="total-sa" class="text-4xl font-black text-emerald-400">₹0</p>
            </div>
            <div class="border-r border-slate-700 text-center">
                <p class="text-[10px] uppercase font-black text-slate-400 mb-1 tracking-widest">Annual Commitment</p>
                <p id="total-premium" class="text-4xl font-black text-indigo-400">₹0</p>
            </div>
            <div class="text-center">
                <p class="text-[10px] uppercase font-black text-slate-400 mb-1 tracking-widest">Due Alerts</p>
                <p id="due-count" class="text-4xl font-black text-orange-400">0</p>
            </div>
        </div>

        <div class="flex gap-3 mt-8">
            <button onclick="render('india')" id="btn-india" class="px-8 py-3 rounded-2xl font-bold bg-slate-900 text-white shadow-xl">INDIA</button>
            <button onclick="render('wife')" id="btn-wife" class="px-8 py-3 rounded-2xl font-bold bg-white text-slate-400 border">WIFE</button>
            <button onclick="render('singapore')" id="btn-singapore" class="px-8 py-3 rounded-2xl font-bold bg-white text-slate-400 border">SINGAPORE</button>
        </div>
    </div>

    <div id="container" class="max-w-7xl mx-auto"></div>

    <script type="module">
        import { POLICY_DATA } from './data.js';
        const TODAY = new Date('2026-03-08');

        window.toggleCard = (id) => document.getElementById(`card-${id}`).classList.toggle('open');

        function updateSummary(list, sym) {
            const totalSA = list.reduce((acc, p) => acc + (p.sumAssured || 0), 0);
            const totalAnnual = list.reduce((acc, p) => acc + (p.dueDate !== "PAID UP" ? p.premium : 0), 0);
            const next30Days = list.filter(p => {
                if (p.dueDate === "PAID UP") return false;
                const [d, m, y] = p.dueDate.split(' ');
                const due = new Date(`${m} ${d}, 2026`);
                const diff = (due - TODAY) / (1000 * 3600 * 24);
                return diff >= 0 && diff <= 30;
            }).length;

            document.getElementById('total-sa').innerText = `${sym}${totalSA.toLocaleString()}`;
            document.getElementById('total-premium').innerText = `${sym}${totalAnnual.toLocaleString()}`;
            document.getElementById('due-count').innerText = `${next30Days}`;
        }

        window.render = function(cat) {
            const list = POLICY_DATA[cat];
            const sym = list[0]?.currency || "₹";
            updateSummary(list, sym);

            document.querySelectorAll('button').forEach(b => b.className = "px-8 py-3 rounded-2xl font-bold bg-white text-slate-400 border border-slate-200");
            document.getElementById(`btn-${cat}`).className = "px-8 py-3 rounded-2xl font-bold bg-slate-900 text-white shadow-xl";

            document.getElementById('container').innerHTML = list.map(p => {
                const startY = parseInt(p.commenced.split(' ')[2]);
                const matY = parseInt(p.maturity.split(' ')[2]);
                const premEndYear = parseInt(p.premiumEnds.split(' ')[2]);
                const isPaid = (p.dueDate === "PAID UP" || TODAY > new Date(p.premiumEnds));
                
                let isDueSoon = false;
                if(p.dueDate !== "PAID UP") {
                    const [d, m, y] = p.dueDate.split(' ');
                    const due = new Date(`${m} ${d}, 2026`);
                    const diff = (due - TODAY) / (1000 * 3600 * 24);
                    isDueSoon = (diff >= 0 && diff <= 30);
                }

                let timelineHtml = '';
                for(let yr = startY; yr <= matY; yr++) {
                    const polY = yr - startY + 1;
                    const isPast = yr < 2026 || (yr === 2026 && TODAY > new Date(p.premiumEnds));
                    let color = ""; let phase = ""; let detail = "";

                    // Premium Paying Phase
                    if (yr <= premEndYear && !isPaid) {
                        const isCurrent = (yr === 2026);
                        const hasBonus = (p.name === "Fortune Maximiser" && polY >= (p.bonusStartYear || 2));
                        
                        if (isCurrent) color = "bg-current";
                        else if (hasBonus) color = isPast ? "bg-mixed-past" : "bg-mixed-future";
                        else color = isPast ? "bg-prem-past" : "bg-prem-future";
                        
                        phase = hasBonus ? "Premium + Bonus" : "Premium Payment";
                        detail = `Pay ${sym}${p.premium.toLocaleString()}`;
                    } 
                    // Nishchit Pension SL Refined: 7 Year Deferment (Payout starts Year 8)
                    else if (p.name === "Nishchit Pension SL" && polY < 8) {
                        color = isPast ? "bg-wait-past" : "bg-wait-future";
                        phase = "Deferment Period"; detail = "Bonus Processing";
                    }
                    // Final Year / Maturity Year
                    else if (yr === matY) {
                         continue; // Handled by mat-node
                    }
                    else {
                        color = isPast ? "bg-wait-past" : "bg-wait-future";
                        if (p.isULIP) { phase = "Market Growth"; detail = "Wealth Accumulation"; }
                        else {
                            phase = "Income Phase";
                            let amt = p.annualPayout ? `${sym}${p.annualPayout.toLocaleString()}` : `${sym}1,00,000`;
                            if (p.payoutSchedule && p.payoutSchedule[polY]) amt = `${sym}${p.payoutSchedule[polY].toLocaleString()}`;
                            detail = `Annual Income: ${amt}`;
                        }
                    }
                    timelineHtml += `<div class="segment ${color}"><div class="tooltip"><b>${phase}</b><br><span class="text-orange-400">${detail}</span><br>Year ${polY} (${yr})</div></div>`;
                }

                return `
                <div class="policy-card" id="card-${p.id}" style="border-color: ${p.color}">
                    <div class="card-header" onclick="toggleCard('${p.id}')">
                        <div class="w-24"><img src="${p.logo}" class="max-h-10"></div>
                        <div class="flex-1 ml-2">
                            <h3 class="text-lg font-black text-slate-900 leading-tight">${p.name}</h3>
                        </div>
                        <div class="flex gap-12 items-center justify-center flex-1">
                            <div class="text-center">
                                <p class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Sum Assured</p>
                                <p class="text-base font-black text-slate-700 leading-none">${sym}${p.sumAssured.toLocaleString()}</p>
                            </div>
                            <div class="text-center border-l border-r px-12">
                                <p class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Annual Premium</p>
                                <p class="text-base font-black text-emerald-600 leading-none">${sym}${p.premium.toLocaleString()}</p>
                            </div>
                        </div>
                        <div class="w-40 flex justify-end">
                            ${isPaid ? `<div class="paid-stamp">PAID UP</div>` : `<div class="px-4 py-2 rounded-xl font-black text-xs transition-all ${isDueSoon ? 'bg-red-600 text-white due-blink' : 'bg-slate-900 text-white'}">${p.dueDate}</div>`}
                        </div>
                    </div>
                    <div class="content-area">
                        <div class="grid grid-cols-3 gap-4 mb-10">
                            <div class="bg-white border p-3 rounded-xl"><p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Policy Number</p><p class="font-black text-slate-700">${p.id}</p></div>
                            <div class="bg-white border p-3 rounded-xl"><p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Client ID</p><p class="font-black text-slate-700">${p.clientId || 'N/A'}</p></div>
                            <div class="bg-white border p-3 rounded-xl"><p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">UIN Number</p><p class="font-black text-indigo-600">${p.uin || 'N/A'}</p></div>
                        </div>
                        <div class="timeline-track">
                             <div class="absolute -top-6 left-0 text-[10px] font-bold text-slate-400">${p.commenced}</div>
                            ${timelineHtml}
                            <div class="mat-node">
                                <span class="text-white text-[10px]">★</span>
                                <div class="tooltip"><b>Maturity Payout</b><br><span class="text-emerald-400 font-bold">${p.maturityAmt}</span><br>${p.maturity}</div>
                            </div>
                             <div class="absolute -top-6 right-0 text-[10px] font-bold text-slate-400">${p.maturity}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }
        render('india');
    </script>
</body>
</html>
