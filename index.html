<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="main-title">Nami Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="main.css">
</head>
<body class="bg-slate-50">
    <div id="version-tag" class="fixed top-3 right-4 text-[10px] font-mono text-slate-400 z-50 bg-white/60 backdrop-blur px-2 py-0.5 rounded-full border border-slate-200"></div>
    <div class="max-w-7xl mx-auto pt-10 pb-4 px-4 flex items-center justify-between">
        <h1 class="brand-header">Nami Portfolio</h1>
        <div id="portfolio-status" class="funky-badge">Portfolio</div>
    </div>
    <div class="max-w-7xl mx-auto px-4 mb-6">
        <div class="flex gap-4 flex-wrap">
            <button class="nav-btn" onclick="render('india')">🇮🇳 India</button>
            <button class="nav-btn" onclick="render('singapore')">🇸🇬 Singapore</button>
            <button class="nav-btn" onclick="render('health')">🏥 Health</button>
            <button class="nav-btn" onclick="render('cashflow')">📊 Cashflow</button>
        </div>
        <div id="sort-container" class="mt-3">
            <select id="sort-trigger" onchange="render(window.currentCategory)" class="sort-select">
                <option value="default">Sort: Default</option>
                <option value="premium">Sort: Premium ↓</option>
                <option value="due">Sort: Due Date</option>
                <option value="time">Sort: Time Left</option>
            </select>
        </div>
    </div>
    <div id="summary-section" class="max-w-7xl mx-auto px-4 mb-6">
        <div id="summary-bar" class="bg-slate-900 p-6 rounded-[40px] text-white shadow-2xl"></div>
    </div>
    <div id="container" class="max-w-7xl mx-auto pb-20 px-4"></div>
    <div id="cf-section" class="max-w-7xl mx-auto px-4 pb-20" style="display:none;"></div>
    <script type="module">
    const VERSION = "4.2.23";
    const { initDashboard, render, handleToggle } = await import(`./app.js?v=${VERSION}`);
    window.render = render;
    window.toggleCard = handleToggle;
    document.getElementById('version-tag').innerText = "v" + VERSION;
    await initDashboard(VERSION);
    </script>
</body>
</html>
