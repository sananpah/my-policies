<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nami Portfolio v3.5.38</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Inter:wght@400;700;900&display=swap');
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; padding: 40px; }
        .brand-header { font-family: 'Orbitron', sans-serif; background: linear-gradient(90deg, #1e293b, #334155); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.5rem; font-weight: 900; }
        .policy-card { background: white; border-radius: 16px; border-left: 12px solid; transition: all 0.3s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .card-header { cursor: pointer; display: flex; align-items: center; padding: 20px 24px; }
        .content-area { display: none; padding: 24px; border-top: 1px solid #f1f5f9; background: #fafbfc; border-radius: 0 0 16px 0; }
        .open .content-area { display: block; }
        .status-badge { font-family: 'Orbitron', sans-serif; font-size: 10px; padding: 4px 12px; border-radius: 6px; font-weight: 900; text-transform: uppercase; }
        .bg-paid-up { background: #10b981; color: white; }
        .bg-active { background: #1e293b; color: white; }
        .logo-box { width: 100px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .logo-img { max-height: 100%; max-width: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div class="max-w-6xl mx-auto mb-10">
        <div class="flex justify-between items-end">
            <div>
                <p class="text-slate-400 font-bold text-xs tracking-widest mb-1 uppercase">Wealth Management System</p>
                <h1 class="brand-header">NAMI PORTFOLIO</h1>
            </div>
            <div class="flex gap-3">
                <button onclick="render('india')" id="btn-india" class="px-5 py-2 rounded-lg font-bold text-sm border bg-white">INDIA</button>
                <button onclick="render('wife')" id="btn-wife" class="px-5 py-2 rounded-lg font-bold text-sm border bg-white">WIFE</button>
                <button onclick="render('singapore')" id="btn-singapore" class="px-5 py-2 rounded-lg font-bold text-sm border bg-white">SINGAPORE</button>
            </div>
        </div>
    </div>

    <div id="container" class="max-w-6xl mx-auto space-y-4"></div>

    <script type="module">
        import { POLICY_DATA } from './data.js';

        window.toggleCard = (id) => {
            const el = document.getElementById(`card-${id}`);
            if(el) el.classList.toggle('open');
        };

        // This helper prevents the crash
        function safeFormat(val, sym) {
            if (val === undefined || val === null || val === "Not Applicable") return "N/A";
            return typeof val === 'number' ? sym + " " + val.toLocaleString() : val;
        }

        window.render = function(cat) {
            const list = POLICY_DATA[cat] || [];
            
            document.querySelectorAll('button').forEach(b => b.className = "px-5 py-2 rounded-lg font-bold text-sm border bg-white text-slate-500");
            const activeBtn = document.getElementById(`btn-${cat}`);
            if (activeBtn) activeBtn.className = "px-5 py-2 rounded-lg font-bold text-sm bg-slate-800 text-white shadow-md";

            const container = document.getElementById('container');
            container.innerHTML = list.map(p => {
                const sym = p.currency || "₹";
                const dateVal = p.dueDate || p.maturityDate || "N/A";

                return `
                <div class="policy-card" id="card-${p.id}" style="border-color: ${p.color || '#cbd5e1'}">
                    <div class="card-header" onclick="toggleCard('${p.id}')">
                        <div class="logo-box">
                            <img src="${p.logo}" class="logo-img" onerror="this.src='https://via.placeholder.com/100x50?text=LOGO'">
                        </div>
                        <div class="flex-1 ml-8">
                            <h3 class="font-black text-slate-800 text-lg">${p.name}</h3>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">${p.type || 'General'}</p>
                        </div>
                        <div class="flex gap-12 items-center mr-12">
                            <div class="text-right">
                                <p class="text-[9px] font-bold text-slate-400 uppercase">Sum Assured</p>
                                <p class="text-md font-black text-slate-700">${safeFormat(p.sumAssured, sym)}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[9px] font-bold text-slate-400 uppercase">Premium</p>
                                <p class="text-md font-black text-emerald-600">${safeFormat(p.premium, sym)}</p>
                            </div>
                        </div>
                        <div class="w-36 text-center">
                            <div class="status-badge ${dateVal === 'PAID UP' ? 'bg-paid-up' : 'bg-active'}">
                                ${dateVal}
                            </div>
                            <p class="text-[8px] font-bold text-slate-400 mt-1 uppercase">Date Info</p>
                        </div>
                    </div>
                    <div class="content-area">
                        <div class="grid grid-cols-4 gap-6 bg-white p-4 rounded-xl border border-slate-100 mb-4">
                            <div><p class="text-[9px] font-bold text-slate-400 uppercase">Policy ID</p><p class="font-bold text-slate-700 font-mono text-xs">${p.id}</p></div>
                            <div><p class="text-[9px] font-bold text-slate-400 uppercase">Commenced</p><p class="font-bold text-slate-700">${p.commenced || 'N/A'}</p></div>
                            <div><p class="text-[9px] font-bold text-slate-400 uppercase">Premium Ends</p><p class="font-bold text-slate-700">${p.premiumEnds || 'N/A'}</p></div>
                            <div><p class="text-[9px] font-bold text-slate-400 uppercase">Maturity</p><p class="font-bold text-slate-700">${p.maturity || p.maturityDate || 'N/A'}</p></div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        };

        render('india');
    </script>
</body>
</html>
