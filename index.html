<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Portfolio Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body { background-color: #fcfcfc; font-family: 'Inter', sans-serif; }
        
        /* Reliance Brand Colors */
        .brand-red-text { color: #8b1d1d; }
        .brand-border { border: 1px solid #e5e7eb; border-top: 2px solid #b91c1c; }
        
        /* Timeline specific styling */
        .vertical-divider {
            width: 2px;
            height: 18px;
            background-color: #22c55e;
            position: absolute;
            top: -6px;
        }
        .start-line { left: 0; }
        .end-line { right: -4px; }

        /* Hover Tooltip */
        .segment:hover::after {
            content: attr(data-fy);
            position: absolute;
            bottom: 150%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            z-index: 50;
        }
    </style>
</head>
<body class="p-6 md:p-12">

    <div id="policy-container" class="max-w-6xl mx-auto space-y-12"></div>

    <script>
        const myPolicies = [
            {
                name: "Reliance Guaranteed Money Back",
                id: "53044042",
                type: "TRADITIONAL",
                sumAssured: "₹ 1,23,940.00",
                premium: "₹ 14,400.00",
                frequency: "Yearly",
                clientId: "62996974",
                uin: "121N084V03",
                dueDate: "08 Sep 2026",
                term: 15,
                commenced: "08 Sep 2017",
                premiumEnds: "08 Sep 2026",
                maturity: "08 Sep 2032",
                lastPaidYear: 2025,
                premiumYears: 10, // 2017 to 2026 inclusive is 10 payments
                color: "#b91c1c"
            },
            {
                name: "HSBC Life Strategic Growth",
                id: "88273341",
                type: "UNIT LINKED",
                sumAssured: "₹ 5,00,000.00",
                premium: "₹ 50,000.00",
                frequency: "Yearly",
                clientId: "77221144",
                uin: "112L099V01",
                dueDate: "15 Mar 2026",
                term: 10,
                commenced: "15 Mar 2020",
                premiumEnds: "15 Mar 2025",
                maturity: "15 Mar 2030",
                lastPaidYear: 2024,
                premiumYears: 6,
                color: "#4c1d95"
            }
        ];

        function render() {
            const container = document.getElementById('policy-container');
            container.innerHTML = myPolicies.map(p => {
                const startYear = parseInt(p.commenced.split(' ')[2]);
                
                let timelineHtml = `<div class="flex gap-1.5 w-full relative">`;
                for (let i = 0; i < p.term; i++) {
                    const currentYear = startYear + i;
                    const isPaid = currentYear <= p.lastPaidYear;
                    const isLastPremiumYear = (i + 1) === p.premiumYears;
                    
                    timelineHtml += `
                        <div class="segment flex-1 h-1.5 rounded-sm relative ${isPaid ? 'bg-green-500' : 'bg-gray-200'}" 
                             data-fy="Y${i+1} - ${currentYear}">
                            ${i === 0 ? '<div class="vertical-divider start-line"></div>' : ''}
                            ${isLastPremiumYear ? '<div class="vertical-divider end-line"></div>' : ''}
                        </div>`;
                }
                timelineHtml += `</div>`;

                return `
                <div class="bg-white rounded-lg shadow-sm brand-border overflow-hidden" style="border-top-color: ${p.color}">
                    <div class="p-6 flex justify-between items-start border-b border-gray-50">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">${p.name}</h2>
                            <p class="text-sm text-gray-400 font-medium tracking-tight">${p.id} • ${p.type}</p>
                        </div>
                        <div class="flex gap-12 text-right">
                            <div>
                                <p class="text-[11px] text-gray-400 uppercase font-semibold">Sum Assured:</p>
                                <p class="text-xl font-bold text-gray-800">${p.sumAssured}</p>
                            </div>
                            <div>
                                <p class="text-[11px] text-gray-400 uppercase font-semibold">Instalment Premium:</p>
                                <p class="text-xl font-bold text-gray-800">${p.premium}</p>
                            </div>
                            <div class="border-l pl-10">
                                <p class="text-[11px] text-gray-400 uppercase font-semibold">Premium Frequency</p>
                                <p class="text-xl font-bold brand-red-text">${p.frequency}</p>
                            </div>
                        </div>
                    </div>

                    <div class="px-6 py-8 grid grid-cols-2 md:grid-cols-6 gap-6 text-sm">
                        <div><p class="text-gray-400 text-xs font-semibold mb-1">Client ID:</p><p class="font-bold text-gray-800 text-base">${p.clientId}</p></div>
                        <div><p class="text-gray-400 text-xs font-semibold mb-1">UIN Number:</p><p class="font-bold text-gray-800 text-base">${p.uin}</p></div>
                        <div><p class="text-gray-400 text-xs font-semibold mb-1">Premium Due Date:</p><p class="font-bold text-gray-800 text-base">${p.dueDate}</p></div>
                        <div><p class="text-gray-400 text-xs font-semibold mb-1">Policy Term:</p><p class="font-bold text-gray-800 text-base">${p.term} Years</p></div>
                        <div><p class="text-gray-400 text-xs font-semibold mb-1">Premium Ends:</p><p class="font-bold text-gray-800 text-base">${p.premiumEnds}</p></div>
                        <div><p class="text-gray-400 text-xs font-semibold mb-1">Maturity Date:</p><p class="font-bold text-gray-800 text-base">${p.maturity}</p></div>
                    </div>

                    <div class="p-6 pb-12">
                        <p class="text-[10px] text-gray-400 mb-6 font-bold tracking-widest uppercase">Policy Timeline • ${p.frequency}</p>
                        ${timelineHtml}
                        <div class="flex justify-between mt-4 text-[11px] text-gray-400 font-medium">
                            <div>Policy Commences<br><span class="text-gray-600 font-bold">${p.commenced}</span></div>
                            <div class="text-center">Premium Payment Ends<br><span class="text-gray-600 font-bold">${p.premiumEnds}</span></div>
                            <div class="text-right">Policy Maturity<br><span class="text-gray-600 font-bold">${p.maturity}</span></div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
        render();
    </script>
</body>
</html>
