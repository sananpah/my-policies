<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .segment-tooltip:hover::after {
            content: attr(data-fy);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            z-index: 10;
        }
        .premium-end-line {
            width: 2px;
            height: 24px;
            background-color: #22c55e;
            position: absolute;
            top: -10px;
        }
    </style>
</head>
<body class="bg-gray-100 p-8">

    <div id="policy-container" class="max-w-5xl mx-auto space-y-6"></div>

    <script>
        const myPolicies = [
            {
                name: "Reliance Guaranteed Money Back",
                id: "53044042",
                type: "TRADITIONAL",
                sumAssured: "₹ 1,23,940.00",
                premium: "₹ 14,400.00",
                frequency: "Yearly",
                clientId: "62996974",
                uin: "121N084V03",
                dueDate: "08 Sep 2026",
                commencedDate: "2017-09-08",
                premiumEndDate: "2026-09-08",
                maturityDate: "2032-09-08",
                totalTermYears: 15
            }
        ];

        function generateTimeline(policy) {
            const startYear = new Date(policy.commencedDate).getFullYear();
            const premiumEndYear = new Date(policy.premiumEndDate).getFullYear();
            const currentYear = new Date().getFullYear(); // 2026 in this context
            
            const totalPolicyYears = policy.totalTermYears;
            const premiumPayingYears = premiumEndYear - startYear + 1;

            let html = `<div class="flex gap-1.5 w-full relative items-center">`;

            for (let i = 0; i < totalPolicyYears; i++) {
                const yearLabel = startYear + i;
                const isPaid = yearLabel <= 2025; // Based on your "Last Paid: 2025" requirement
                const isPremiumPeriod = i < premiumPayingYears;
                
                // Requirement 3: Financial Year Hover
                const fyText = `Y${i+1} - ${yearLabel}`;

                html += `
                    <div 
                        class="segment-tooltip flex-1 h-1.5 rounded-sm relative cursor-help ${isPaid ? 'bg-green-500' : 'bg-gray-200'}" 
                        data-fy="${fyText}">
                        
                        ${(i + 1) === premiumPayingYears ? '<div class="premium-end-line right-0"></div>' : ''}
                    </div>`;
            }

            html += `</div>`;
            return html;
        }

        function render() {
            const container = document.getElementById('policy-container');
            container.innerHTML = myPolicies.map(p => `
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-red-100 flex justify-between items-start">
                        <div>
                            <h2 class="text-xl font-bold text-gray-800">${p.name}</h2>
                            <p class="text-xs text-gray-400 uppercase tracking-widest">${p.id} • ${p.type}</p>
                        </div>
                        <div class="flex gap-10">
                            <div class="text-right"><p class="text-[10px] text-gray-400">Sum Assured</p><p class="font-bold text-red-800">${p.sumAssured}</p></div>
                            <div class="text-right"><p class="text-[10px] text-gray-400">Instalment Premium</p><p class="font-bold text-red-800">${p.premium}</p></div>
                        </div>
                    </div>

                    <div class="p-6 grid grid-cols-3 md:grid-cols-6 gap-4 text-sm border-b border-gray-50">
                        <div><p class="text-gray-400 text-xs">Client ID</p><p class="font-bold">${p.clientId}</p></div>
                        <div><p class="text-gray-400 text-xs">UIN Number</p><p class="font-bold">${p.uin}</p></div>
                        <div><p class="text-gray-400 text-xs">Due Date</p><p class="font-bold">08 Sep 2026</p></div>
                        <div><p class="text-gray-400 text-xs">Policy Term</p><p class="font-bold">${p.totalTermYears} Years</p></div>
                        <div><p class="text-gray-400 text-xs">Premium Ends</p><p class="font-bold">08 Sep 2026</p></div>
                        <div><p class="text-gray-400 text-xs">Maturity Date</p><p class="font-bold">08 Sep 2032</p></div>
                    </div>

                    <div class="p-6 pt-8">
                        <p class="text-[10px] text-gray-400 mb-6 uppercase tracking-tighter">Policy Timeline • Yearly</p>
                        ${generateTimeline(p)}
                        <div class="flex justify-between mt-4 text-[10px] text-gray-500">
                            <div>Policy Commences<br><span class="font-bold text-gray-700">08 Sep 2017</span></div>
                            <div class="text-center">Premium Payment Ends<br><span class="font-bold text-gray-700">08 Sep 2026</span></div>
                            <div class="text-right">Policy Maturity<br><span class="font-bold text-gray-700">08 Sep 2032</span></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        render();
    </script>
</body>
</html>
